<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>园区企业服务工具箱 - 登录</title>
<style>
:root{--bg1:#f5f9ff;--bg2:#e9f1ff;--card:rgba(255,255,255,.92);--line:#d5e3f8;--text:#1f3254;--muted:#5f7394;--primary:#1e5fbf;--primary2:#194f9f;--shadow:0 24px 60px rgba(20,55,110,.14)}
*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--text);background-image:linear-gradient(130deg,rgba(10,39,82,.72),rgba(16,65,130,.55)),url("园区侧影.jpg");background-size:cover;background-position:center center;background-repeat:no-repeat;background-attachment:fixed;}
.page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:22px}.layout{width:min(1040px,100%);display:grid;grid-template-columns:1.12fr .88fr;gap:20px}
.brand,.panel{border-radius:22px;border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(8px)}
.brand{padding:34px;background:linear-gradient(150deg,#1956af,#2674d6 65%,#66a0ef);color:#fff;display:flex;flex-direction:column;gap:18px}
.brand h1{margin:0;font-size:34px;line-height:1.25;letter-spacing:.5px}.brand .sub{margin:0;font-size:16px;opacity:.95;line-height:1.8}
.note{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.36);border-radius:12px;font-size:13px;line-height:1.7}
.note i{font-style:normal;font-size:15px}
.panel{background:var(--card);padding:24px}
.tabs{display:grid;grid-template-columns:1fr 1fr;padding:5px;background:rgba(255,255,255,.55);border:1px solid rgba(255,255,255,.72);border-radius:13px;margin-bottom:16px}
.tab{border:none;background:rgba(255,255,255,.45);padding:10px 12px;border-radius:10px;font-size:15px;font-weight:800;color:#1d3f70;cursor:pointer}.tab.active{color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary2));box-shadow:0 8px 20px rgba(27,79,158,.28)}
label{display:block;margin:11px 0 6px;font-size:14px;font-weight:600;color:#2f4669}
input{width:100%;height:44px;padding:0 12px;border:1px solid #cfdef6;border-radius:11px;background:#fafdff;font-size:14px;color:var(--text);transition:.2s}
input:focus{outline:none;border-color:#75a4e8;box-shadow:0 0 0 3px rgba(30,95,191,.12);background:#fff}
.submit{width:100%;margin-top:16px;height:44px;border:none;border-radius:11px;background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;font-size:15px;font-weight:700;cursor:pointer;box-shadow:0 10px 24px rgba(30,95,191,.28)}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;font-size:13px;display:none}.msg.show{display:block}.msg.error{background:rgba(233,244,255,.92);color:#1f4877;border:1px solid rgba(133,180,232,.8)}.msg.success{background:rgba(240,247,255,.95);color:#125f94;border:1px solid rgba(157,197,237,.9)}.hint{margin-top:10px;color:var(--muted);font-size:13px}.hidden{display:none}
@media (max-width:880px){.layout{grid-template-columns:1fr}.brand h1{font-size:28px}.page{padding:14px}}
</style>
</head>
<body>
<div class="page"><div class="layout">
<section class="brand">
  <div>
    <h1>园区企业服务工具箱</h1>
    <p class="sub">企业走访记录 · 政策申报初筛 · 服务台账管理</p>
  </div>
  <div class="note"><i>ℹ️</i><span>已升级为云端账号登录，邮箱账号可跨设备使用。请勿录入敏感企业信息。</span></div>
</section>
<section class="panel">
  <div class="tabs"><button id="tabLogin" class="tab active" type="button">登录</button><button id="tabRegister" class="tab" type="button">注册</button></div>
  <form id="loginForm" novalidate>
    <label>邮箱</label><input id="loginEmail" type="email" required>
    <label>密码</label><input id="loginPassword" type="password" required>
    <button class="submit" id="loginSubmitBtn" type="button">登录并进入系统</button>
  </form>
  <form id="registerForm" class="hidden" novalidate>
    <label>邮箱</label><input id="regEmail" type="email" required>
    <label>密码</label><input id="regPassword" type="password" required>
    <label>确认密码</label><input id="regConfirmPassword" type="password" required>
    <label>昵称</label><input id="regNickname" required>
    <button class="submit" id="registerSubmitBtn" type="button">注册账号</button>
  </form>
  <div id="message" class="msg"></div>
</section></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
document.addEventListener('DOMContentLoaded',()=>{

const SUPABASE_URL='https://gzuihbsvghmryybyphfl.supabase.co';
const SUPABASE_KEY='sb_publishable_5Tk7IKGl8NNP78whhTDgdA_H7xO6hLl';
const STORAGE_USERS='pt_users_v1',STORAGE_CURRENT='pt_current_user_v1';
const loadUsers=()=>JSON.parse(localStorage.getItem(STORAGE_USERS)||'{}');
const saveUsers=(u)=>localStorage.setItem(STORAGE_USERS,JSON.stringify(u));

const msgEl=document.getElementById('message');
const tabLoginBtn=document.getElementById('tabLogin');
const tabRegisterBtn=document.getElementById('tabRegister');
const loginForm=document.getElementById('loginForm');
const registerForm=document.getElementById('registerForm');
const loginEmailInput=document.getElementById('loginEmail');
const loginPasswordInput=document.getElementById('loginPassword');
const regEmailInput=document.getElementById('regEmail');
const regPasswordInput=document.getElementById('regPassword');
const regConfirmPasswordInput=document.getElementById('regConfirmPassword');
const regNicknameInput=document.getElementById('regNickname');
const loginSubmitBtn=document.getElementById('loginSubmitBtn');
const registerSubmitBtn=document.getElementById('registerSubmitBtn');

const showMsg=(text,type='error')=>{msgEl.textContent=text||'操作失败，请稍后重试。';msgEl.className=`msg show ${type}`;};
const clearMsg=()=>{msgEl.textContent='';msgEl.className='msg';};
const isValidEmail=(email)=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
const setButtonLoading=(btn,isLoading,idleText)=>{if(!btn)return;btn.disabled=isLoading;btn.textContent=isLoading?'处理中...':idleText;};
const withTimeout=(promise,ms,msg)=>Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);
const setTab=(isLogin)=>{tabLoginBtn.classList.toggle('active',isLogin);tabRegisterBtn.classList.toggle('active',!isLogin);loginForm.classList.toggle('hidden',!isLogin);registerForm.classList.toggle('hidden',isLogin);clearMsg();};

let supabaseClient=null;
try{
  if(!window.supabase||typeof window.supabase.createClient!=='function') throw new Error('Supabase SDK 加载失败');
  supabaseClient=window.supabaseClient&&window.supabaseClient.auth?window.supabaseClient:window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
  window.supabaseClient=supabaseClient;
}catch(err){
  console.error('Supabase 初始化失败:',err);
  showMsg('系统初始化失败，请刷新页面后重试。');
}

(async()=>{
  if(!supabaseClient) return;
  const params=new URLSearchParams(window.location.search);
  if(params.get('logged_out')==='1') return;
  try{
    const {data,error}=await supabaseClient.auth.getSession();
    if(error){
      console.error('读取登录状态失败:',error);
      console.warn('读取登录状态失败:',error);
      return;
    }
    if(data.session){window.location.replace('index.html');}
  }catch(err){
    console.error('读取登录状态异常:',err);
    console.warn('读取登录状态异常:',err);
  }
})();

tabLoginBtn.addEventListener('click',()=>setTab(true));
tabRegisterBtn.addEventListener('click',()=>setTab(false));

const handleLogin=async()=>{
  if(!supabaseClient) return showMsg('系统初始化失败，请刷新页面后重试。');
  const email=loginEmailInput.value.trim().toLowerCase();
  const password=loginPasswordInput.value;
  if(!isValidEmail(email)) return showMsg('邮箱格式不正确。');
  if(password.length<6) return showMsg('密码长度不足，至少 6 位。');

  setButtonLoading(loginSubmitBtn,true,'登录并进入系统');
  try{
    const {data,error}=await withTimeout(supabaseClient.auth.signInWithPassword({email,password}),10000,'登录超时');
    if(error){
      if((error.message||'').includes('Invalid login credentials')) return showMsg('邮箱或密码错误。');
      if((error.message||'').includes('Email not confirmed')) return showMsg('邮箱尚未验证，请先完成邮箱验证。');
      return showMsg(err?.message==='登录超时'?'加载较慢，请稍后或刷新。':'登录失败，请稍后重试。');
    }
    localStorage.setItem(STORAGE_CURRENT,(data.user?.email||email).toLowerCase());
    showMsg('登录成功，正在进入系统…','success');
    setTimeout(()=>window.location.href='index.html',350);
  }catch(err){
    console.error('登录异常:',err);
    showMsg(err?.message==='登录超时'?'加载较慢，请稍后或刷新。':'登录失败，请稍后重试。');
  }finally{
    setButtonLoading(loginSubmitBtn,false,'登录并进入系统');
  }
};

const handleRegister=async()=>{
  if(!supabaseClient) return showMsg('系统初始化失败，请刷新页面后重试。');
  const email=regEmailInput.value.trim().toLowerCase();
  const password=regPasswordInput.value;
  const confirm=regConfirmPasswordInput.value;
  const nickname=regNicknameInput.value.trim();
  if(!isValidEmail(email)) return showMsg('邮箱格式不正确。');
  if(password.length<6) return showMsg('密码长度不足，至少 6 位。');
  if(password!==confirm) return showMsg('两次密码不一致。');
  if(!nickname) return showMsg('请填写昵称。');

  setButtonLoading(registerSubmitBtn,true,'注册账号');
  try{
    const {data,error}=await withTimeout(supabaseClient.auth.signUp({email,password}),10000,'注册超时');
    if(error){
      if((error.message||'').includes('already registered')) return showMsg('该邮箱已注册，请直接登录。');
      return showMsg(err?.message==='注册超时'?'加载较慢，请稍后或刷新。':'保存失败，请稍后重试。');
    }
    const users=loadUsers();
    users[email]={...(users[email]||{}),nickname,avatarDataUrl:users[email]?.avatarDataUrl||'',updatedAt:Date.now()};
    saveUsers(users);

    if(data.session){
      localStorage.setItem(STORAGE_CURRENT,email);
      showMsg('注册成功，正在进入系统…','success');
      setTimeout(()=>window.location.href='index.html',350);
      return;
    }
    showMsg('注册成功，请前往邮箱完成验证后再登录。','success');
  }catch(err){
    console.error('注册异常:',err);
    showMsg(err?.message==='注册超时'?'加载较慢，请稍后或刷新。':'保存失败，请稍后重试。');
  }finally{
    setButtonLoading(registerSubmitBtn,false,'注册账号');
  }
};

loginSubmitBtn.addEventListener('click',handleLogin);
registerSubmitBtn.addEventListener('click',handleRegister);

});
</script>
</body></html>
