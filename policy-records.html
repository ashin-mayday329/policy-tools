<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>企业初筛记录</title><style>:root{--bg:#eef4ff;--card:#fff;--line:#d6e3f6;--text:#1e304e}*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1260px;margin:18px auto;padding:0 14px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}.top{display:flex;justify-content:space-between}.user{display:flex;align-items:center;gap:8px}.avatar{width:30px;height:30px;border-radius:50%;overflow:hidden;background:#dce9ff;display:flex;align-items:center;justify-content:center}.avatar img{width:100%;height:100%;object-fit:cover}.btn{border:none;border-radius:9px;padding:8px 12px;color:#fff;background:#1f5fbf;cursor:pointer}.btn.ghost{background:#6d82a1}.search{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e7eefb}.modal{position:fixed;inset:0;background:rgba(14,30,55,.35);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{background:#fff;border-radius:12px;border:1px solid var(--line);padding:16px;max-width:760px;max-height:85vh;overflow:auto;width:100%}pre{white-space:pre-wrap;background:#f7faff;padding:10px;border:1px solid #dfebff}.muted{color:#607392}</style><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><section class="top"><div>企业初筛记录</div><div><a class="btn ghost" href="index.html">返回首页</a> <button id="migrateBtn" class="btn">迁移本机企业初筛记录到云端</button> <button id="logoutBtn" class="btn ghost">退出登录</button></div></section><section class="card"><input id="search" class="search" placeholder="搜索企业名称、行业、综合建议关键词"/><table class="table"><thead><tr><th>企业名称</th><th>注册区县或注册地址</th><th>所属行业</th><th>主营产品或服务</th><th>综合建议</th><th>省科小</th><th>国科小</th><th>高企</th><th>市创</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></section></main><div id="detailModal" class="modal"><div class="panel"><h3>初筛报告详情</h3><div id="detail"></div><button id="copyBtn" class="btn">复制报告</button> <button id="closeBtn" class="btn ghost">关闭</button></div></div>
<script>document.addEventListener('DOMContentLoaded',async()=>{const supabase=window.supabase.createClient('https://gzuihbsvghmryybyphfl.supabase.co','sb_publishable_5Tk7IKGl8NNP78whhTDgdA_H7xO6hLl');const $=id=>document.getElementById(id);const safe=(el,e,f)=>el&&el.addEventListener(e,f);const fmt=t=>new Date(t||Date.now()).toLocaleString('zh-CN',{hour12:false});const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const {data}=await supabase.auth.getSession();const session=data&&data.session;if(!session||!session.user){location.replace('login.html');return;}const uid=session.user.id,email=(session.user.email||'').toLowerCase();localStorage.setItem('pt_current_user_v1',email);const {data:profile}=await supabase.from('profiles').select('nickname,avatar_url').eq('id',uid).maybeSingle();const titleEl=document.querySelector('.top > div:first-child');if(titleEl){const name=(profile&&profile.nickname)||email;const avatar=(profile&&profile.avatar_url)||'';titleEl.innerHTML=`<span class="user"><span class="avatar">${avatar?`<img src="${esc(avatar)}" alt="头像">`:(esc(name[0]||'人'))}</span><span>${esc(name)} · 企业初筛记录</span></span>`;}let rows=[],active=null;async function load(){const {data,error}=await supabase.from('policy_records').select('*').eq('user_id',uid).order('updated_at',{ascending:false}).order('created_at',{ascending:false});if(error){alert('读取企业初筛记录失败，请稍后重试。');return;}rows=data||[];render();}function render(){const kw=($('search').value||'').trim().toLowerCase();const list=rows.filter(r=>!kw||[r.company_name,r.industry,r.overall_advice].join(' ').toLowerCase().includes(kw));$('tbody').innerHTML=list.map(r=>`<tr><td>${esc(r.company_name||'未填写')}</td><td>${esc(r.district||'未填写')}</td><td>${esc(r.industry||'未填写')}</td><td>${esc(r.main_business||'未填写')}</td><td>${esc(r.overall_advice||'未填写')}</td><td>${esc(r.province_result||'未填写')}</td><td>${esc(r.national_result||'未填写')}</td><td>${esc(r.hightech_result||'未填写')}</td><td>${esc(r.city_result||'未填写')}</td><td>${fmt(r.created_at)}</td><td>${fmt(r.updated_at||r.created_at)}</td><td><button class="btn" data-a="view" data-id="${r.id}">查看报告</button> <button class="btn ghost" data-a="del" data-id="${r.id}">删除记录</button></td></tr>`).join('')||'<tr><td colspan="12" class="muted">暂无企业初筛记录</td></tr>'}function oldRecords(){const keys=[`policyRecords_${email}`,'policyRecords','records'];for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(v)&&v.length)return v;}catch(_){}}return[]}async function migrate(){const old=oldRecords();if(!old.length){alert('未找到可迁移的本机企业初筛记录。');return;}const payload=old.map(r=>({user_id:uid,company_name:r.company||'',district:r.district||'',industry:r.industry||'',main_business:r.mainBiz||'',handler:r.operator||'',overall_advice:r.overall||'',province_result:r.skRes||'',national_result:r.gkRes||'',hightech_result:r.hqRes||'',city_result:r.scRes||'',report_text:r.reportText||'',form_data:r.rawFormData||r.formData||r||{}}));const {error}=await supabase.from('policy_records').insert(payload);if(error){alert('迁移失败，请稍后重试。');return;}alert('本机企业初筛记录已迁移到云端');load();}async function del(id){if(!confirm('请再次确认：确定删除该记录吗？'))return;if(!confirm('删除后不可恢复，是否继续？'))return;const {error}=await supabase.from('policy_records').delete().eq('id',id).eq('user_id',uid);if(error){alert('删除失败，请稍后重试。');return;}load();}safe($('search'),'input',render);safe($('logoutBtn'),'click',async(e)=>{console.log('logout clicked');const btn=e.currentTarget,old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='退出中...';}try{const {error}=await supabase.auth.signOut();if(error){console.error(error);console.log('signOut failed',error);alert('退出登录失败，请刷新后重试。');return;}console.log('signOut success');localStorage.removeItem('pt_current_user_v1');location.replace('login.html');}catch(err){console.error(err);console.log('signOut failed',err);alert('退出登录失败，请刷新后重试。');}finally{if(btn){btn.disabled=false;btn.textContent=old||'退出登录';}}});safe($('migrateBtn'),'click',migrate);safe($('tbody'),'click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id;const rec=rows.find(x=>String(x.id)===String(id));if(b.dataset.a==='view'&&rec){active=rec;$('detail').innerHTML=`<p><b>企业名称：</b>${esc(rec.company_name||'未填写')}</p><p><b>注册区县或注册地址：</b>${esc(rec.district||'未填写')}</p><p><b>所属行业：</b>${esc(rec.industry||'未填写')}</p><p><b>主营产品或服务：</b>${esc(rec.main_business||'未填写')}</p><p><b>综合建议：</b>${esc(rec.overall_advice||'未填写')}</p><p><b>完整报告：</b></p><pre>${esc(rec.report_text||'未生成初筛报告')}</pre>`;$('detailModal').classList.add('show');}if(b.dataset.a==='del'){del(id);}});safe($('closeBtn'),'click',()=>$('detailModal').classList.remove('show'));safe($('detailModal'),'click',e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('show')});safe($('copyBtn'),'click',async()=>{const t=active&&active.report_text;if(!t){alert('暂无可复制内容。');return;}try{await navigator.clipboard.writeText(t);alert('已复制。');}catch(_){alert('复制失败，请手动复制。');}});load();});</script></body></html>
