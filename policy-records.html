<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>企业初筛记录</title><link rel="stylesheet" href="assets/app.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><section class="top"><div><h1>企业初筛记录</h1><p>检索与管理企业政策初筛结果</p></div><div><a class="btn ghost" href="index.html">返回首页</a> <button id="migrateBtn" class="btn">迁移本机企业初筛记录到云端</button> <button id="profileBtn" data-action="open-profile" type="button" class="btn">个人资料</button> <button id="logoutBtn" data-action="logout" type="button" class="btn ghost">退出登录</button></div></section><section class="card"><input id="search" class="search" placeholder="搜索企业名称、行业、综合建议关键词"/><table class="table"><thead><tr><th>企业名称</th><th>注册区县或注册地址</th><th>所属行业</th><th>主营产品或服务</th><th>综合建议</th><th>省科小</th><th>国科小</th><th>高企</th><th>市创</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></section></main><div id="detailModal" class="modal"><div class="panel"><h3>初筛报告详情</h3><div id="detail"></div><button id="copyBtn" type="button" class="btn">复制报告</button> <button id="closeBtn" type="button" class="btn ghost">关闭</button></div></div>
<script>document.addEventListener('DOMContentLoaded',async()=>{const SUPABASE_URL='https://gzuihbsvghmryybyphfl.supabase.co',SUPABASE_KEY='sb_publishable_5Tk7IKGl8NNP78whhTDgdA_H7xO6hLl';const initSupabaseClient=()=>{if(window.supabaseClient&&window.supabaseClient.auth)return window.supabaseClient;if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase SDK 加载失败');window.supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return window.supabaseClient;};const supabase=initSupabaseClient();const $=id=>document.getElementById(id);const safe=(el,e,f)=>el&&el.addEventListener(e,f);const fmt=t=>new Date(t||Date.now()).toLocaleString('zh-CN',{hour12:false});const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));const {data}=await supabase.auth.getSession();const session=data&&data.session;if(!session||!session.user){location.replace('login.html');return;}const uid=session.user.id,email=(session.user.email||'').toLowerCase();localStorage.setItem('pt_current_user_v1',email);const {data:profile}=await supabase.from('profiles').select('nickname,avatar_url').eq('id',uid).maybeSingle();const titleEl=document.querySelector('.top > div:first-child');if(titleEl){const name=(profile&&profile.nickname)||email;const avatar=(profile&&profile.avatar_url)||'';titleEl.innerHTML=`<span class="user"><span class="avatar">${avatar?`<img src="${esc(avatar)}" alt="头像">`:(esc(name[0]||'人'))}</span><span>${esc(name)} · 企业初筛记录</span></span>`;}let rows=[],active=null;async function load(){const {data,error}=await supabase.from('policy_records').select('*').eq('user_id',uid).order('updated_at',{ascending:false}).order('created_at',{ascending:false});if(error){alert('加载较慢，请稍后或刷新。');return;}rows=data||[];render();}function render(){const kw=($('search').value||'').trim().toLowerCase();const list=rows.filter(r=>!kw||[r.company_name,r.industry,r.overall_advice].join(' ').toLowerCase().includes(kw));$('tbody').innerHTML=list.map(r=>`<tr><td>${esc(r.company_name||'未填写')}</td><td>${esc(r.district||'未填写')}</td><td>${esc(r.industry||'未填写')}</td><td>${esc(r.main_business||'未填写')}</td><td>${esc(r.overall_advice||'未填写')}</td><td>${esc(r.province_result||'未填写')}</td><td>${esc(r.national_result||'未填写')}</td><td>${esc(r.hightech_result||'未填写')}</td><td>${esc(r.city_result||'未填写')}</td><td>${fmt(r.created_at)}</td><td>${fmt(r.updated_at||r.created_at)}</td><td><button type="button" class="btn" data-a="view" data-id="${r.id}">查看报告</button> <button type="button" class="btn ghost" data-a="del" data-id="${r.id}">删除记录</button></td></tr>`).join('')||'<tr><td colspan="12" class="muted">暂无企业初筛记录</td></tr>'}function oldRecords(){const keys=[`policyRecords_${email}`,'policyRecords','records'];for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(v)&&v.length)return v;}catch(_){}}return[]}async function migrate(){const old=oldRecords();if(!old.length){alert('未找到可迁移的本机企业初筛记录。');return;}const payload=old.map(r=>({user_id:uid,company_name:r.company||'',district:r.district||'',industry:r.industry||'',main_business:r.mainBiz||'',handler:r.operator||'',overall_advice:r.overall||'',province_result:r.skRes||'',national_result:r.gkRes||'',hightech_result:r.hqRes||'',city_result:r.scRes||'',report_text:r.reportText||'',form_data:r.rawFormData||r.formData||r||{}}));const {error}=await supabase.from('policy_records').insert(payload);if(error){alert('保存失败，请稍后重试。');return;}alert('已保存到云端。');load();}async function del(id){if(!confirm('请再次确认：确定删除该记录吗？'))return;if(!confirm('删除后不可恢复，是否继续？'))return;const {error}=await supabase.from('policy_records').delete().eq('id',id).eq('user_id',uid);if(error){alert('保存失败，请稍后重试。');return;}load();}safe($('search'),'input',render);const withTimeout=(promise,ms,msg)=>Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);async function handleLogout(btn){console.log('logout clicked');const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='退出中...';}try{if(window.supabaseClient&&window.supabaseClient.auth){await withTimeout(window.supabaseClient.auth.signOut(),5000,'退出登录超时');console.log('logout success');}}catch(err){console.error('logout error or timeout:',err);}finally{location.replace('login.html?logged_out=1');if(btn){btn.disabled=false;btn.textContent=old||'退出登录';}}}document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(b.dataset.action==='open-profile'){console.log('open profile clicked');location.href='index.html';}if(b.dataset.action==='logout'){handleLogout(b);}});safe($('migrateBtn'),'click',migrate);safe($('tbody'),'click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id;const rec=rows.find(x=>String(x.id)===String(id));if(b.dataset.a==='view'&&rec){active=rec;$('detail').innerHTML=`<p><b>企业名称：</b>${esc(rec.company_name||'未填写')}</p><p><b>注册区县或注册地址：</b>${esc(rec.district||'未填写')}</p><p><b>所属行业：</b>${esc(rec.industry||'未填写')}</p><p><b>主营产品或服务：</b>${esc(rec.main_business||'未填写')}</p><p><b>综合建议：</b>${esc(rec.overall_advice||'未填写')}</p><p><b>完整报告：</b></p><pre>${esc(rec.report_text||'未生成初筛报告')}</pre>`;$('detailModal').classList.add('show');}if(b.dataset.a==='del'){del(id);}});safe($('closeBtn'),'click',()=>$('detailModal').classList.remove('show'));safe($('detailModal'),'click',e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('show')});safe($('copyBtn'),'click',async()=>{const t=active&&active.report_text;if(!t){alert('暂无可复制内容。');return;}try{await navigator.clipboard.writeText(t);alert('已复制。');}catch(_){alert('复制失败，请手动复制。');}});load();});</script></body></html>
