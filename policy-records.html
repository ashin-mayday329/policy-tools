<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>企业初筛记录</title>
<style>:root{--bg:#eef4ff;--card:#fff;--line:#d6e3f6;--text:#1e304e;--primary:#1f5fbf}*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1260px;margin:18px auto;padding:0 14px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(20,50,95,.08)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px}.user{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#dce9ff;display:flex;align-items:center;justify-content:center;font-weight:700}.avatar img{width:100%;height:100%;object-fit:cover}.btn{border:none;border-radius:9px;padding:8px 12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1f5fbf,#1a4f9f);text-decoration:none}.btn.ghost{background:#6d82a1}.card{margin-top:12px;padding:14px}.search{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e7eefb;text-align:left;vertical-align:top}.actions button{margin-right:6px}.muted{color:#607392}.modal{position:fixed;inset:0;background:rgba(14,30,55,.35);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{background:#fff;border-radius:12px;border:1px solid var(--line);padding:16px;max-width:760px;max-height:85vh;overflow:auto;width:100%}pre{white-space:pre-wrap;background:#f7faff;padding:10px;border-radius:8px;border:1px solid #dfebff}@media(max-width:760px){.top{flex-direction:column;align-items:flex-start}.table{display:block;overflow:auto;white-space:nowrap}}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><section class="top"><div class="user"><span id="avatar" class="avatar">人</span><div><div id="nickname">-</div><div class="muted">企业初筛记录</div></div></div><div><a class="btn ghost" href="index.html">返回首页</a> <button id="logoutBtn" class="btn ghost">退出登录</button></div></section>
<section class="card"><input id="search" class="search" placeholder="搜索企业名称、行业、综合建议关键词"/><table class="table"><thead><tr><th>企业名称</th><th>注册区县或注册地址</th><th>所属行业</th><th>主营产品或服务</th><th>综合建议</th><th>省科小</th><th>国科小</th><th>高企</th><th>市创</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></section></main>
<div id="detailModal" class="modal"><div class="panel"><h3>初筛报告详情</h3><div id="detail"></div><button id="copyBtn" class="btn">复制报告</button> <button id="closeBtn" class="btn ghost">关闭</button></div></div>
<script>const SUPABASE_URL='https://gzuihbsvghmryybyphfl.supabase.co',SUPABASE_KEY='sb_publishable_5Tk7IKGl8NNP78whhTDgdA_H7xO6hLl';const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const USERS='pt_users_v1',CUR='pt_current_user_v1';const users=JSON.parse(localStorage.getItem(USERS)||'{}');const current=localStorage.getItem(CUR)||'';if(!current){location.replace('login.html');}const key=`policyRecords_${current}`;const fmt=(t)=>new Date(t||Date.now()).toLocaleString('zh-CN',{hour12:false});const esc=(v)=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));function renderAvatar(){const u=users[current]||{};nickname.textContent=u.nickname||current;if(u.avatarDataUrl){avatar.innerHTML=`<img src="${u.avatarDataUrl}" alt="头像">`}else{avatar.textContent=(u.nickname||current||'人')[0];}}const getList=()=>JSON.parse(localStorage.getItem(key)||'[]');function render(){const kw=search.value.trim().toLowerCase();const rows=getList().filter(r=>!kw||[r.company,r.industry,r.overall].join(' ').toLowerCase().includes(kw));tbody.innerHTML=rows.map(r=>`<tr><td>${esc(r.company||'未填写')}</td><td>${esc(r.district||'未填写')}</td><td>${esc(r.industry||'未填写')}</td><td>${esc(r.mainBiz||'未填写')}</td><td>${esc(r.overall||'未填写')}</td><td>${esc(r.skRes||'未填写')}</td><td>${esc(r.gkRes||'未填写')}</td><td>${esc(r.hqRes||'未填写')}</td><td>${esc(r.scRes||'未填写')}</td><td>${fmt(r.createdAt)}</td><td>${fmt(r.updatedAt)}</td><td class="actions"><button class="btn" onclick="view('${r.id}')">查看报告</button><button class="btn ghost" onclick="delRec('${r.id}')">删除记录</button></td></tr>`).join('')||'<tr><td colspan="12" class="muted">暂无企业初筛记录</td></tr>';}let active=null;function view(id){active=getList().find(i=>i.id===id);if(!active)return;detail.innerHTML=`<p><b>企业名称：</b>${esc(active.company||'未填写')}</p><p><b>注册区县或注册地址：</b>${esc(active.district||'未填写')}</p><p><b>所属行业：</b>${esc(active.industry||'未填写')}</p><p><b>主营产品或服务：</b>${esc(active.mainBiz||'未填写')}</p><p><b>综合建议：</b>${esc(active.overall||'未填写')}</p><p><b>省科小：</b>${esc(active.skRes||'未填写')} ｜ <b>国科小：</b>${esc(active.gkRes||'未填写')} ｜ <b>高企：</b>${esc(active.hqRes||'未填写')} ｜ <b>市创：</b>${esc(active.scRes||'未填写')}</p><pre>${esc(active.reportText||'未生成报告文本')}</pre>`;detailModal.classList.add('show');}function delRec(id){if(!confirm('确定删除该企业初筛记录吗？删除后无法恢复。'))return;const list=getList().filter(i=>i.id!==id);localStorage.setItem(key,JSON.stringify(list));render();}search.addEventListener('input',render);logoutBtn.onclick=async()=>{await supabase.auth.signOut();localStorage.removeItem(CUR);location.replace('login.html');};closeBtn.onclick=()=>detailModal.classList.remove('show');detailModal.onclick=(e)=>{if(e.target===detailModal)detailModal.classList.remove('show');};copyBtn.onclick=async()=>{if(!active||!active.reportText)return alert('暂无可复制报告。');try{await navigator.clipboard.writeText(active.reportText);alert('报告已复制。');}catch{alert('复制失败，请手动复制。');}};renderAvatar();render();</script></body></html>
