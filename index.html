<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>园区企业走访台账</title>
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2a37;
      --muted: #5b6472;
      --primary: #1664d8;
      --border: #d8e0ea;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }

    .container {
      max-width: 860px;
      margin: 32px auto;
      padding: 0 16px 24px;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 4px 18px rgba(15, 23, 42, 0.06);
      padding: 20px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #0f3468;
    }

    .desc {
      margin: 0 0 18px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .full { grid-column: 1 / -1; }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 14px;
    }

    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fff;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    button {
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
    }

    button:hover { filter: brightness(1.06); }

    .result {
      margin-top: 18px;
      border: 1px dashed #9eb9e8;
      background: #f8fbff;
      border-radius: 10px;
      padding: 14px;
    }

    .result h2 {
      margin: 0 0 8px;
      font-size: 16px;
      color: #0f3468;
    }

    #summary {
      margin: 0;
      white-space: pre-wrap;
      color: #1f2a37;
    }

    @media (max-width: 700px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1>园区企业走访台账</h1>
      <p class="desc">填写走访信息后，点击按钮自动生成规范化走访总结。</p>

      <div class="grid">
        <div>
          <label for="company">企业名称</label>
          <input id="company" placeholder="例如：XX科技有限公司" />
        </div>
        <div>
          <label for="contact">联系人</label>
          <input id="contact" placeholder="例如：张三" />
        </div>
        <div>
          <label for="phone">联系电话</label>
          <input id="phone" placeholder="例如：13800000000" />
        </div>

        <div class="full">
          <label for="needs">企业需求</label>
          <textarea id="needs" placeholder="请输入企业提出的主要需求"></textarea>
        </div>

        <div class="full">
          <label for="policy">政策问题</label>
          <textarea id="policy" placeholder="请输入企业关注的政策问题"></textarea>
        </div>

        <div class="full">
          <label for="action">后续动作</label>
          <textarea id="action" placeholder="请输入后续服务计划与责任安排"></textarea>
        </div>
      </div>

      <button id="generateBtn">生成走访总结</button>

      <div class="result" aria-live="polite">
        <h2>走访总结</h2>
        <p id="summary">（点击“生成走访总结”后会显示在这里）</p>
      </div>
    </section>
  </main>

  <script>
    const getValue = (id) => document.getElementById(id).value.trim();

    document.getElementById('generateBtn').addEventListener('click', () => {
      const company = getValue('company') || '（未填写企业名称）';
      const contact = getValue('contact') || '（未填写联系人）';
      const phone = getValue('phone') || '（未填写联系电话）';
      const needs = getValue('needs') || '（暂无企业需求记录）';
      const policy = getValue('policy') || '（暂无政策问题记录）';
      const action = getValue('action') || '（暂无后续动作安排）';
      const today = new Date().toLocaleDateString('zh-CN');

      const text = `于${today}，园区服务人员对【${company}】开展了走访沟通。\n` +
        `企业联系人为：${contact}，联系电话：${phone}。\n` +
        `企业需求：${needs}。\n` +
        `政策问题：${policy}。\n` +
        `后续动作：${action}。\n` +
        `总体来看，本次走访已形成初步问题清单和服务计划，后续将按节点持续跟进。`;

      document.getElementById('summary').textContent = text;
    });
  </script>
</body>
</html>
