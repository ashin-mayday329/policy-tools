<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>园区企业走访总结生成器</title>
  <style>
    :root {
      --bg: #eef3fb;
      --bg-accent: #e6eefc;
      --card: #ffffff;
      --text: #1c2b45;
      --muted: #5f6f89;
      --primary: #1f5fbf;
      --primary-dark: #184d9a;
      --secondary: #0c7ea2;
      --light: #6b7f9d;
      --border: #d7e2f2;
      --shadow: 0 10px 30px rgba(20, 50, 100, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 220px, var(--bg) 100%);
      color: var(--text);
      line-height: 1.65;
    }
    .container { max-width: 980px; margin: 24px auto 32px; padding: 0 16px; }
    .hero {
      background: linear-gradient(135deg, #12489c 0%, #1a66cf 68%, #2b79d9 100%);
      color: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 14px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
    .hero p { margin: 0; opacity: .95; font-size: 14px; }
    .hero-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .auth-box{ background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:10px 12px; min-width:260px;}
    .auth-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
    .auth-text{font-size:13px; margin-bottom:8px; color:#f1f6ff;}
    .user-entry{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
    .profile-trigger{display:flex; align-items:center; gap:8px; border:none; background:transparent; color:#fff; cursor:pointer; padding:0;}
    .profile-trigger:hover{opacity:.92;}
    .avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#d4e4ff,#b8d2fa); color:#174999; display:flex; align-items:center; justify-content:center; font-weight:700; border:1px solid rgba(255,255,255,.6);}
    .avatar.has-image{padding:0; overflow:hidden; color:transparent;}
    .avatar.has-image img{width:100%; height:100%; object-fit:cover; display:block;}
    .nickname{font-size:14px; font-weight:700; color:#f4f8ff;}
    .auth-btn{background:#fff; color:#1b56ae; border:none; border-radius:8px; padding:6px 10px; font-size:13px; font-weight:700; cursor:pointer;}
    .auth-btn.ghost{background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.45);}
    .notice {margin: 12px 0 14px; background:#fff9e7; border:1px solid #f2ddb0; color:#785d1d; border-radius:12px; padding:10px 12px; font-size:13px;}
    .auth-modal{position:fixed; inset:0; background:rgba(9,27,58,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:20;}
    .auth-modal.show{display:flex;}
    .profile-modal{position:fixed; inset:0; background:rgba(9,27,58,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:25;}
    .profile-modal.show{display:flex;}
    .auth-panel{width:min(460px,100%); background:#fff; border-radius:14px; border:1px solid var(--border); box-shadow:var(--shadow); padding:18px;}
    .auth-tabs{display:flex; gap:8px; margin-bottom:12px;}
    .auth-tab{flex:1; border:1px solid var(--border); background:#f6f9ff; color:#27476b; border-radius:8px; padding:8px; font-weight:700; cursor:pointer;}
    .auth-tab.active{background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; border-color:transparent;}
    .hidden{display:none;}
    .form-note{font-size:12px;color:#5f6f89;margin-top:8px;}
    .profile-avatar-wrap{display:flex; align-items:center; gap:12px; margin-bottom:10px;}
    .profile-avatar-preview{width:56px; height:56px; border-radius:50%; border:1px solid var(--border); background:linear-gradient(135deg,#eaf1ff,#d4e6ff); display:flex; align-items:center; justify-content:center; overflow:hidden; color:#1b56ae; font-weight:700;}
    .profile-avatar-preview img{width:100%; height:100%; object-fit:cover; display:block;}
    .hero-tools { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-tools a {
      display: inline-block;
      text-decoration: none;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.36);
      color: #fff;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
    }
    .hero-tools a:hover { background: rgba(255,255,255,.28); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .section-title { margin: 0 0 14px; font-size: 18px; color: #123f80; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 14px; color: #284667; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fbfdff;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #78a9ea;
      box-shadow: 0 0 0 3px rgba(31, 95, 191, .12);
      background: #fff;
    }
    textarea { min-height: 94px; resize: vertical; }
    .actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(18, 72, 156, .18);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    button:hover { filter: brightness(1.03); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    #generateBtn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
    #copyBtn { background: linear-gradient(135deg, #0f91ba 0%, var(--secondary) 100%); }
    #clearBtn { background: linear-gradient(135deg, #778aa9 0%, var(--light) 100%); }
    .result {
      margin-top: 18px;
      border: 1px solid #b9d1f4;
      background: linear-gradient(180deg, #fafdff 0%, #f2f7ff 100%);
      border-radius: 14px;
      padding: 16px;
    }
    .result h2 { margin: 0 0 8px; font-size: 17px; color: #123f80; }
    #summary {
      margin: 0;
      white-space: pre-wrap;
      color: #20324f;
      font-size: 14px;
      background: #fff;
      border: 1px solid #d6e3f7;
      border-radius: 10px;
      padding: 14px;
      min-height: 120px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .hero h1 { font-size: 24px; }
      .hero-top { flex-direction:column; }
      .auth-box { width:100%; min-width:0; }
      .container { margin-top: 18px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>园区企业走访服务台账</h1>
          <p>园区企业服务工作记录工具（内部使用）</p>
          <div class="hero-tools">
            <a href="policy-screen.html">政策申报初筛工具</a>
          </div>
        </div>
        <div class="auth-box">
          <div id="authGuest" class="auth-row">
            <span class="auth-text">未登录</span>
            <button id="openLoginBtn" class="auth-btn" type="button">登录 / 注册</button>
          </div>
          <div id="authUser" class="hidden">
            <div class="user-entry">
              <button id="openProfileBtn" class="profile-trigger" type="button">
                <span id="userAvatar" class="avatar">U</span>
                <span id="userNickname" class="nickname">-</span>
              </button>
              <button id="logoutBtn" class="auth-btn ghost" type="button">退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div class="notice">提示：本版本账号数据仅保存在当前浏览器本地（localStorage），更换设备或清理缓存后可能丢失，请勿录入敏感企业信息。</div>
    <section class="card">
      <h2 class="section-title">走访信息录入</h2>

      <div class="grid">
        <div><label for="company">企业名称</label><input id="company" placeholder="例如：宁波云论光电力科技有限公司" /></div>
        <div><label for="visitStaff">走访人员</label><input id="visitStaff" placeholder="例如：张三、李四" /></div>
        <div><label for="contact">联系人</label><input id="contact" placeholder="例如：王经理" /></div>
        <div><label for="phone">联系电话</label><input id="phone" placeholder="例如：13800000000" /></div>
        <div class="full"><label for="address">企业实际办公地</label><input id="address" placeholder="例如：宁波市鄞州区XX路XX号XX楼" /></div>

        <div class="full"><label for="basic">企业基本情况</label><textarea id="basic" placeholder="可填写业务板块、人员规模、发展方向等"></textarea></div>
        <div class="full"><label for="needs">企业需求</label><textarea id="needs" placeholder="可填写场地、融资、招工、市场对接、政策配套等诉求"></textarea></div>
        <div class="full"><label for="solution">园区解决方案</label><textarea id="solution" placeholder="可填写已对接事项、责任部门、下一步推进建议"></textarea></div>
      </div>

      <div class="actions">
        <button id="generateBtn">生成走访总结</button>
        <button id="copyBtn" type="button">复制总结</button>
        <button id="clearBtn" type="button">清空表单</button>
      </div>

      <div class="result" aria-live="polite">
        <h2>走访总结</h2>
        <p id="summary">（点击“生成走访总结”后会显示在这里）</p>
      </div>
    </section>
  </main>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <section class="auth-panel">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">登录</button>
        <button id="tabRegister" class="auth-tab" type="button">注册</button>
      </div>
      <form id="loginForm">
        <div><label for="loginUsername">账号</label><input id="loginUsername" required /></div>
        <div><label for="loginPassword">密码</label><input id="loginPassword" type="password" required /></div>
        <div class="actions"><button type="submit" id="loginSubmit">立即登录</button><button type="button" id="closeModalBtn" class="auth-btn ghost">取消</button></div>
      </form>
      <form id="registerForm" class="hidden">
        <div><label for="regUsername">账号</label><input id="regUsername" required /></div>
        <div><label for="regNickname">昵称</label><input id="regNickname" required /></div>
        <div><label for="regPassword">密码</label><input id="regPassword" type="password" required /></div>
        <div><label for="regConfirmPassword">确认密码</label><input id="regConfirmPassword" type="password" required /></div>
        <div class="actions"><button type="submit" id="registerSubmit">注册并登录</button><button type="button" id="closeModalBtn2" class="auth-btn ghost">取消</button></div>
        <p class="form-note">密码将使用浏览器加密哈希后保存（本地版，仅用于基础防明文）。</p>
      </form>
    </section>
  </div>


  <div id="profileModal" class="profile-modal" aria-hidden="true">
    <section class="auth-panel">
      <h3 style="margin:0 0 12px;color:#123f80;">个人资料</h3>
      <form id="profileForm">
        <div class="profile-avatar-wrap">
          <span id="profileAvatarPreview" class="profile-avatar-preview">人</span>
          <div style="flex:1;">
            <label for="profileAvatarInput">头像上传</label>
            <input id="profileAvatarInput" type="file" accept="image/*" />
            <p class="form-note" style="margin:6px 0 0;">建议上传 2MB 以内图片，系统将自动压缩并保存到本地。</p>
          </div>
        </div>
        <div><label for="profileNickname">昵称</label><input id="profileNickname" required /></div>
        <div class="actions">
          <button type="submit">保存昵称</button>
          <button type="button" id="closeProfileBtn" class="auth-btn ghost">取消</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    const getValue = (id) => document.getElementById(id).value.trim();
    const summaryEl = document.getElementById('summary');
    const fieldIds = ['company','visitStaff','contact','phone','address','basic','needs','solution'];

    const STORAGE_USERS = 'pt_users_v1';
    const STORAGE_CURRENT = 'pt_current_user_v1';
    const DEFAULT_AVATAR = '人';
    const authGuest = document.getElementById('authGuest');
    const authUser = document.getElementById('authUser');
    const userNicknameEl = document.getElementById('userNickname');
    const authModal = document.getElementById('authModal');
    const profileModal = document.getElementById('profileModal');
    const userAvatarEl = document.getElementById('userAvatar');
    const profileAvatarPreviewEl = document.getElementById('profileAvatarPreview');
    const profileAvatarInputEl = document.getElementById('profileAvatarInput');
    let pendingAvatarDataUrl = '';

    const loadUsers = () => JSON.parse(localStorage.getItem(STORAGE_USERS) || '{}');
    const saveUsers = (users) => localStorage.setItem(STORAGE_USERS, JSON.stringify(users));
    const getCurrentUser = () => localStorage.getItem(STORAGE_CURRENT) || '';
    const setCurrentUser = (username) => {
      if (username) localStorage.setItem(STORAGE_CURRENT, username);
      else localStorage.removeItem(STORAGE_CURRENT);
    };

    async function hashPassword(password) {
      if (window.crypto && window.crypto.subtle) {
        const msgUint8 = new TextEncoder().encode(password);
        const hashBuffer = await crypto.subtle.digest('SHA-256', msgUint8);
        return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
      }
      return btoa(unescape(encodeURIComponent(password)));
    }

    const renderAvatar = (container, nickname, avatarDataUrl) => {
      if (avatarDataUrl) {
        container.classList.add('has-image');
        container.innerHTML = '<img alt="用户头像" src="">';
        container.querySelector('img').src = avatarDataUrl;
      } else {
        container.classList.remove('has-image');
        container.textContent = (nickname && nickname[0] ? nickname[0] : DEFAULT_AVATAR).toUpperCase();
      }
    };

    function closeProfileModal() {
      profileModal.classList.remove('show');
      profileModal.setAttribute('aria-hidden', 'true');
      profileAvatarInputEl.value = '';
      pendingAvatarDataUrl = '';
    }

    async function compressImageToDataUrl(file, maxWidth = 320, quality = 0.82) {
      const imageUrl = URL.createObjectURL(file);
      const img = await new Promise((resolve, reject) => {
        const image = new Image();
        image.onload = () => resolve(image);
        image.onerror = reject;
        image.src = imageUrl;
      });
      const scale = Math.min(1, maxWidth / Math.max(img.width, img.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(imageUrl);
      return canvas.toDataURL('image/jpeg', quality);
    }

    function refreshAuthUI() {
      const username = getCurrentUser();
      const users = loadUsers();
      if (username && users[username]) {
        const nickname = users[username].nickname || username;
        authGuest.classList.add('hidden');
        authUser.classList.remove('hidden');
        userNicknameEl.textContent = nickname;
        renderAvatar(userAvatarEl, nickname, users[username].avatarDataUrl || '');
      } else {
        setCurrentUser('');
        authGuest.classList.remove('hidden');
        authUser.classList.add('hidden');
      }
    }

    function showModal(tab = 'login') {
      authModal.classList.add('show');
      authModal.setAttribute('aria-hidden', 'false');
      setTab(tab);
    }
    function hideModal() {
      authModal.classList.remove('show');
      authModal.setAttribute('aria-hidden', 'true');
    }
    function setTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
    }

    document.getElementById('openLoginBtn').addEventListener('click', () => showModal('login'));
    document.getElementById('openProfileBtn').addEventListener('click', () => {
      const username = getCurrentUser();
      const users = loadUsers();
      if (!username || !users[username]) return;
      document.getElementById('profileNickname').value = users[username].nickname || username;
      pendingAvatarDataUrl = users[username].avatarDataUrl || '';
      renderAvatar(profileAvatarPreviewEl, users[username].nickname || username, pendingAvatarDataUrl);
      profileAvatarInputEl.value = '';
      profileModal.classList.add('show');
      profileModal.setAttribute('aria-hidden', 'false');
    });
    document.getElementById('logoutBtn').addEventListener('click', () => { setCurrentUser(''); refreshAuthUI(); });
    document.getElementById('tabLogin').addEventListener('click', () => setTab('login'));
    document.getElementById('tabRegister').addEventListener('click', () => setTab('register'));
    document.getElementById('closeModalBtn').addEventListener('click', hideModal);
    document.getElementById('closeModalBtn2').addEventListener('click', hideModal);
    authModal.addEventListener('click', (e) => { if (e.target === authModal) hideModal(); });
    document.getElementById('closeProfileBtn').addEventListener('click', closeProfileModal);
    profileModal.addEventListener('click', (e) => {
      if (e.target === profileModal) {
        closeProfileModal();
      }
    });
    profileAvatarInputEl.addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file) return;
      if (!file.type.startsWith('image/')) {
        alert('请选择图片文件。');
        e.target.value = '';
        return;
      }
      try {
        pendingAvatarDataUrl = await compressImageToDataUrl(file, file.size > 2 * 1024 * 1024 ? 260 : 320, file.size > 2 * 1024 * 1024 ? 0.75 : 0.82);
        const nickname = document.getElementById('profileNickname').value.trim() || getCurrentUser() || DEFAULT_AVATAR;
        renderAvatar(profileAvatarPreviewEl, nickname, pendingAvatarDataUrl);
      } catch (error) {
        alert('头像处理失败，请更换图片重试。');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUsername').value.trim();
      const nickname = document.getElementById('regNickname').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm = document.getElementById('regConfirmPassword').value;
      if (!username || !nickname || !password) return alert('请完整填写注册信息。');
      if (password !== confirm) return alert('两次输入的密码不一致。');
      const users = loadUsers();
      if (users[username]) return alert('该账号已存在，请更换账号。');
      users[username] = { nickname, passwordHash: await hashPassword(password), createdAt: Date.now() };
      saveUsers(users);
      setCurrentUser(username);
      refreshAuthUI();
      hideModal();
      e.target.reset();
      alert('注册成功，已自动登录。');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUsername').value.trim();
      const password = document.getElementById('loginPassword').value;
      const users = loadUsers();
      const user = users[username];
      if (!user) return alert('账号不存在，请先注册。');
      const passwordHash = await hashPassword(password);
      if (passwordHash !== user.passwordHash) return alert('密码错误，请重试。');
      setCurrentUser(username);
      refreshAuthUI();
      hideModal();
      e.target.reset();
      alert('登录成功。');
    });

    refreshAuthUI();

    document.getElementById('profileForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const username = getCurrentUser();
      const users = loadUsers();
      if (!username || !users[username]) return;
      const nickname = document.getElementById('profileNickname').value.trim();
      if (!nickname) return alert('昵称不能为空。');
      users[username].nickname = nickname;
      users[username].avatarDataUrl = pendingAvatarDataUrl || users[username].avatarDataUrl || '';
      saveUsers(users);
      refreshAuthUI();
      closeProfileModal();
      alert('个人资料已更新。');
    });

    document.getElementById('generateBtn').addEventListener('click', () => {
      const company = getValue('company') || '某企业';
      const visitStaff = getValue('visitStaff') || '园区服务人员';
      const contact = getValue('contact') || '未填写';
      const phone = getValue('phone') || '未填写';
      const address = getValue('address') || '未填写';
      const basic = getValue('basic') || '企业基本情况暂未详细提供，已在走访中完成初步了解，后续将结合企业提供材料进一步补充完善。';
      const needs = getValue('needs') || '本次走访中，企业暂无新增明确诉求，后续将围绕经营发展需求保持动态沟通。';
      const solution = getValue('solution') || '针对企业当前情况，园区将安排专人持续跟进，并会同相关业务条线研究可行支持路径，形成闭环服务。';
      const today = new Date().toLocaleDateString('zh-CN');

      const text = `${company}走访总结\n` +
        `走访时间：${today}\n` +
        `走访人员：${visitStaff}\n` +
        `企业联系人：${contact}（${phone}）\n` +
        `企业实际办公地：${address}\n\n` +
        `一、企业基本情况\n` +
        `${basic}\n` +
        `从本次走访情况看，企业具备一定经营基础和发展规划，相关业务方向与园区产业升级、绿色低碳和企业服务导向具有一定契合度。\n\n` +
        `二、企业经营及业务情况\n` +
        `经沟通了解，企业围绕主营方向持续推进业务落地，整体经营节奏平稳。当前企业在市场拓展、项目实施和资源协同方面保持积极态势，具备与园区企业开展供需对接、场景合作和能力互补的现实基础。\n` +
        `企业表示，如园区内或周边企业在相关业务领域存在合作需求，希望园区协助开展信息对接，推动形成实质性合作机会。\n\n` +
        `三、企业主要诉求\n` +
        `本次走访中，企业提出以下需求：\n` +
        `一是${needs}\n` +
        `二是希望在政策解读、资源匹配和服务衔接方面获得持续支持，以便更高效推进项目落地与业务发展。\n\n` +
        `四、下一步服务建议\n` +
        `一是结合企业诉求，由园区服务专班建立跟进台账，明确责任人和时间节点，实行闭环推进。\n` +
        `二是围绕企业重点需求，联动招商、经发及相关职能条线开展专题对接，提升服务响应效率。\n` +
        `三是${solution}\n` +
        `四是建议于近期组织阶段性回访，动态更新诉求办理进展，确保服务举措与企业实际需求保持一致。\n`;

      summaryEl.textContent = text;
    });

    document.getElementById('copyBtn').addEventListener('click', async () => {
      const text = summaryEl.textContent.trim();
      if (!text || text.includes('点击“生成走访总结”')) {
        alert('请先生成走访总结，再复制。');
        return;
      }
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(text);
        } else {
          const temp = document.createElement('textarea');
          temp.value = text;
          document.body.appendChild(temp);
          temp.select();
          document.execCommand('copy');
          document.body.removeChild(temp);
        }
        alert('走访总结已复制，可直接粘贴到台账。');
      } catch (error) {
        alert('复制失败，请手动复制下方总结内容。');
      }
    });

    document.getElementById('clearBtn').addEventListener('click', () => {
      fieldIds.forEach((id) => { document.getElementById(id).value = ''; });
      summaryEl.textContent = '（点击“生成走访总结”后会显示在这里）';
    });
  </script>
</body>
</html>
