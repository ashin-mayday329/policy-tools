<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>园区企业服务工具箱</title>
  <style>
    :root {
      --bg: #eef3fb;
      --bg-accent: #e6eefc;
      --card: #ffffff;
      --text: #1c2b45;
      --muted: #5f6f89;
      --primary: #1f5fbf;
      --primary-dark: #184d9a;
      --secondary: #0c7ea2;
      --light: #6b7f9d;
      --border: #d7e2f2;
      --shadow: 0 10px 30px rgba(20, 50, 100, 0.08);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      background: linear-gradient(180deg, var(--bg-accent) 0%, var(--bg) 220px, var(--bg) 100%);
      color: var(--text);
      line-height: 1.65;
    }
    .container { max-width: 980px; margin: 24px auto 32px; padding: 0 16px; }
    .hero {
      background: linear-gradient(135deg, #12489c 0%, #1a66cf 68%, #2b79d9 100%);
      color: #fff;
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px 24px;
      margin-bottom: 14px;
    }
    .hero h1 { margin: 0 0 6px; font-size: 28px; letter-spacing: .5px; }
    .hero p { margin: 0; opacity: .95; font-size: 14px; }
    .hero-top { display:flex; justify-content:space-between; gap:12px; align-items:flex-start; }
    .auth-box{ background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.35); border-radius:12px; padding:10px 12px; min-width:260px;}
    .auth-row{display:flex; gap:8px; flex-wrap:wrap; align-items:center;}
    .auth-text{font-size:13px; margin-bottom:8px; color:#f1f6ff;}
    .user-entry{display:flex; align-items:center; gap:10px; margin-bottom:8px;}
    .profile-trigger{display:flex; align-items:center; gap:8px; border:none; background:transparent; color:#fff; cursor:pointer; padding:0;}
    .profile-trigger:hover{opacity:.92;}
    .avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#d4e4ff,#b8d2fa); color:#174999; display:flex; align-items:center; justify-content:center; font-weight:700; border:1px solid rgba(255,255,255,.6);}
    .avatar.has-image{padding:0; overflow:hidden; color:transparent;}
    .avatar.has-image img{width:100%; height:100%; object-fit:cover; display:block;}
    .nickname{font-size:14px; font-weight:700; color:#f4f8ff;}
    .auth-btn{background:#fff; color:#1b56ae; border:none; border-radius:8px; padding:6px 10px; font-size:13px; font-weight:700; cursor:pointer;}
    .auth-btn.ghost{background:rgba(255,255,255,.2); color:#fff; border:1px solid rgba(255,255,255,.45);}
    .user-pill{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.45);backdrop-filter:blur(6px)}
    .auth-btn.subtle{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.45);color:#fff;}
    .auth-btn.subtle:hover,.auth-btn.ghost:hover{background:rgba(255,255,255,.32);}
    .profile-modal{background:rgba(9,27,58,.35);}
    #profileForm .actions button[type="submit"]{background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;}
    #profileForm .actions .cancel-btn{background:#e6eefc;color:#1d4679;border:1px solid #bdd2f2;box-shadow:none;}

    .notice {margin: 12px 0 14px; background:rgba(240,247,255,.92); border:1px solid #c6dcfa; color:#2b5384; border-radius:12px; padding:10px 12px; font-size:13px;}
    .auth-modal{position:fixed; inset:0; background:rgba(9,27,58,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:20;}
    .auth-modal.show{display:flex;}
    .profile-modal{position:fixed; inset:0; background:rgba(9,27,58,.45); display:none; align-items:center; justify-content:center; padding:16px; z-index:25;}
    .profile-modal.show{display:flex;}
    .auth-panel{width:min(460px,100%); background:#ffffff; border-radius:16px; border:1px solid #d8e6fb; box-shadow:0 16px 36px rgba(18,61,124,.18); padding:20px;}
    .auth-tabs{display:flex; gap:8px; margin-bottom:12px;}
    .auth-tab{flex:1; border:1px solid var(--border); background:#f6f9ff; color:#27476b; border-radius:8px; padding:8px; font-weight:700; cursor:pointer;}
    .auth-tab.active{background:linear-gradient(135deg, var(--primary), var(--primary-dark)); color:#fff; border-color:transparent;}
    .hidden{display:none;}
    .form-note{font-size:12px;color:#5f6f89;margin-top:8px;}
    .profile-avatar-wrap{display:flex; align-items:center; gap:14px; margin-bottom:10px; padding:12px; border:1px solid #dbe8fb; border-radius:12px; background:linear-gradient(180deg,#fafdff,#f2f8ff);} 
    .profile-avatar-preview{width:64px; height:64px; border-radius:50%; border:2px solid #bcd6fb; background:linear-gradient(135deg,#eaf1ff,#d4e6ff); display:flex; align-items:center; justify-content:center; overflow:hidden; color:#1b56ae; font-weight:700;box-shadow:0 8px 16px rgba(27,86,174,.15);} 
    .profile-avatar-preview img{width:100%; height:100%; object-fit:cover; display:block;}
    .hero-tools { margin-top: 10px; display: flex; gap: 10px; flex-wrap: wrap; }
    .hero-tools a {
      display: inline-block;
      text-decoration: none;
      background: rgba(255,255,255,.18);
      border: 1px solid rgba(255,255,255,.36);
      color: #fff;
      padding: 7px 12px;
      border-radius: 9px;
      font-size: 13px;
      font-weight: 600;
    }
    .hero-tools a:hover { background: rgba(255,255,255,.28); }
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: var(--shadow);
      padding: 22px;
    }
    .section-title { margin: 0 0 14px; font-size: 18px; color: #123f80; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .full { grid-column: 1 / -1; }
    label { display: block; margin-bottom: 7px; font-weight: 600; font-size: 14px; color: #284667; }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 14px;
      font-family: inherit;
      background: #fbfdff;
      color: var(--text);
      transition: border-color .2s, box-shadow .2s, background .2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: #78a9ea;
      box-shadow: 0 0 0 3px rgba(31, 95, 191, .12);
      background: #fff;
    }
    textarea { min-height: 94px; resize: vertical; }
    .actions { margin-top: 16px; display: flex; flex-wrap: wrap; gap: 10px; }
    button {
      border: none;
      border-radius: 10px;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      padding: 10px 18px;
      cursor: pointer;
      box-shadow: 0 6px 14px rgba(18, 72, 156, .18);
      transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
    }
    button:hover { filter: brightness(1.03); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    #generateBtn { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); }
    #copyBtn { background: linear-gradient(135deg, #0f91ba 0%, var(--secondary) 100%); }
    #clearBtn { background: linear-gradient(135deg, #778aa9 0%, var(--light) 100%); }
    .result {
      margin-top: 18px;
      border: 1px solid #b9d1f4;
      background: linear-gradient(180deg, #fafdff 0%, #f2f7ff 100%);
      border-radius: 14px;
      padding: 16px;
    }
    .result h2 { margin: 0 0 8px; font-size: 17px; color: #123f80; }
    #summary {
      margin: 0;
      white-space: pre-wrap;
      color: #20324f;
      font-size: 14px;
      background: #fff;
      border: 1px solid #d6e3f7;
      border-radius: 10px;
      padding: 14px;
      min-height: 120px;
    }
    @media (max-width: 760px) {
      .grid { grid-template-columns: 1fr; }
      .full { grid-column: auto; }
      .hero h1 { font-size: 24px; }
      .hero-top { flex-direction:column; }
      .auth-box { width:100%; min-width:0; }
      .container { margin-top: 18px; }
    }
  </style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <main class="container">
    <header class="hero">
      <div class="hero-top">
        <div>
          <h1>园区企业走访服务台账</h1>
          <p>企业走访记录 · 政策申报初筛 · 服务台账管理</p>
          <div class="hero-tools">
            <a href="policy-screen.html">政策申报初筛工具</a>
            <a href="visit-records.html">走访记录查询</a>
            <a href="policy-records.html">企业初筛记录</a>
          </div>
        </div>
        <div class="auth-box user-pill">
          <div id="authGuest" class="auth-row">
            <span class="auth-text">未登录</span>
            <button id="openLoginBtn" class="auth-btn" type="button">登录 / 注册</button>
          </div>
          <div id="authUser" class="hidden">
            <div class="user-entry">
              <button id="openProfileBtn" class="profile-trigger" type="button">
                <span id="userAvatar" class="avatar">U</span>
                <span id="userNickname" class="nickname">-</span>
              </button>
              <button id="profileEntryBtn" class="auth-btn ghost" type="button">个人资料</button>
              <button id="logoutBtn" class="auth-btn subtle" type="button">退出登录</button>
            </div>
          </div>
        </div>
      </div>
    </header>
    <div id="appNotice" class="notice">提示：本系统为本地演示版，账号和数据仅保存在当前浏览器本地，请勿录入敏感企业信息。</div>
    <section class="card">
      <h2 class="section-title">走访信息录入</h2>

      <div class="grid">
        <div><label for="company">企业名称</label><input id="company" placeholder="例如：宁波云论光电力科技有限公司" /></div>
        <div><label for="visitStaff">走访人员</label><input id="visitStaff" placeholder="例如：张三、李四" /></div>
        <div><label for="contact">联系人</label><input id="contact" placeholder="例如：王经理" /></div>
        <div><label for="phone">联系电话</label><input id="phone" placeholder="例如：13800000000" /></div>
        <div class="full"><label for="address">企业实际办公地</label><input id="address" placeholder="例如：宁波市鄞州区XX路XX号XX楼" /></div>

        <div class="full"><label for="basic">企业基本情况</label><textarea id="basic" placeholder="可填写业务板块、人员规模、发展方向等"></textarea></div>
        <div class="full"><label for="needs">企业需求</label><textarea id="needs" placeholder="可填写场地、融资、招工、市场对接、政策配套等诉求"></textarea></div>
        <div class="full"><label for="solution">园区解决方案</label><textarea id="solution" placeholder="可填写已对接事项、责任部门、下一步推进建议"></textarea></div>
      </div>

      <div class="actions">
        <button id="generateBtn" type="button">生成走访总结</button>
        <button id="copyBtn" type="button">复制总结</button>
        <button id="saveVisitBtn" type="button" style="background:linear-gradient(135deg,#1e76c6,#1b56ae)">保存到走访记录</button>
        <button id="clearBtn" type="button">清空表单</button>
      </div>

      <div class="result" aria-live="polite">
        <h2>走访总结</h2>
        <p id="summary">（点击“生成走访总结”后会显示在这里）</p>
      </div>
    </section>
  </main>

  <div id="authModal" class="auth-modal" aria-hidden="true">
    <section class="auth-panel">
      <div class="auth-tabs">
        <button id="tabLogin" class="auth-tab active" type="button">登录</button>
        <button id="tabRegister" class="auth-tab" type="button">注册</button>
      </div>
      <form id="loginForm">
        <div><label for="loginUsername">账号</label><input id="loginUsername" required /></div>
        <div><label for="loginPassword">密码</label><input id="loginPassword" type="password" required /></div>
        <div class="actions"><button type="submit" id="loginSubmit">立即登录</button><button type="button" id="closeModalBtn" class="auth-btn ghost">取消</button></div>
      </form>
      <form id="registerForm" class="hidden">
        <div><label for="regUsername">账号</label><input id="regUsername" required /></div>
        <div><label for="regNickname">昵称</label><input id="regNickname" required /></div>
        <div><label for="regPassword">密码</label><input id="regPassword" type="password" required /></div>
        <div><label for="regConfirmPassword">确认密码</label><input id="regConfirmPassword" type="password" required /></div>
        <div class="actions"><button type="submit" id="registerSubmit">注册并登录</button><button type="button" id="closeModalBtn2" class="auth-btn ghost">取消</button></div>
        <p class="form-note">密码将使用浏览器加密哈希后保存（本地版，仅用于基础防明文）。</p>
      </form>
    </section>
  </div>


  <div id="profileModal" class="profile-modal" aria-hidden="true">
    <section class="auth-panel">
      <h3 style="margin:0 0 14px;color:#123f80;font-size:20px;">个人资料</h3>
      <form id="profileForm">
        <div class="profile-avatar-wrap">
          <span id="profileAvatarPreview" class="profile-avatar-preview">人</span>
          <div style="flex:1;">
            <label for="profileAvatarInput">头像上传</label>
            <input id="profileAvatarInput" type="file" accept="image/*" />
            <p class="form-note" style="margin:6px 0 0;">建议上传 2MB 以内图片，上传后会即时预览并保存到本地。</p>
          </div>
        </div>
        <div><label for="profileNickname">昵称</label><input id="profileNickname" required /></div>
        <div class="actions">
          <button type="submit">保存修改</button>
          <button type="button" id="closeProfileBtn" class="cancel-btn">取消</button>
        </div>
      </form>
    </section>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const SUPABASE_URL='https://gzuihbsvghmryybyphfl.supabase.co';
      const SUPABASE_KEY='sb_publishable_5Tk7IKGl8NNP78whhTDgdA_H7xO6hLl';
      const STORAGE_USERS='pt_users_v1';
      const STORAGE_CURRENT='pt_current_user_v1';
      const DEFAULT_AVATAR='人';
      const noticeEl = document.getElementById('appNotice');
      const showNotice=(t)=>{ if(noticeEl) noticeEl.textContent=t; };
      if(!window.supabase||typeof window.supabase.createClient!=='function'){ showNotice('Supabase SDK 加载失败，请刷新后重试。'); return; }
      const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
      const $=(id)=>document.getElementById(id);
      const safeBind=(el,evt,fn)=>{ if(el) el.addEventListener(evt,fn); };
      const loadUsers=()=>JSON.parse(localStorage.getItem(STORAGE_USERS)||'{}');
      const setCurrentUser=(email)=>email?localStorage.setItem(STORAGE_CURRENT,email.toLowerCase()):localStorage.removeItem(STORAGE_CURRENT);
      const getCurrentUser=()=> (localStorage.getItem(STORAGE_CURRENT)||'').toLowerCase();
      const renderAvatar=(container,nickname,avatarDataUrl)=>{ if(!container) return; if(avatarDataUrl){container.classList.add('has-image');container.innerHTML='<img alt="用户头像" src="">';container.querySelector('img').src=avatarDataUrl;}else{container.classList.remove('has-image');container.textContent=(nickname&&nickname[0]?nickname[0]:DEFAULT_AVATAR).toUpperCase();}};
      const refreshAuthUI=()=>{ const email=getCurrentUser(); const users=loadUsers(); const guest=$('authGuest'); const user=$('authUser'); const nick=$('userNickname'); const avatar=$('userAvatar'); if(email){ guest&&guest.classList.add('hidden'); user&&user.classList.remove('hidden'); const n=(users[email]&&users[email].nickname)||email; if(nick) nick.textContent=n; renderAvatar(avatar,n,(users[email]&&users[email].avatarDataUrl)||''); } else { guest&&guest.classList.remove('hidden'); user&&user.classList.add('hidden'); } };

      (async()=>{ try{ const {data,error}=await supabase.auth.getSession(); if(error) throw error; const email=(data.session&&data.session.user&&data.session.user.email||'').toLowerCase(); if(!email){ window.location.replace('login.html'); return; } setCurrentUser(email); refreshAuthUI(); }catch(e){ showNotice('登录状态检查失败，请刷新页面重试。'); } })();
      supabase.auth.onAuthStateChange((_e,session)=>{ const email=(session&&session.user&&session.user.email||'').toLowerCase(); if(email){ setCurrentUser(email); refreshAuthUI(); } else { setCurrentUser(''); window.location.replace('login.html'); } });

      safeBind($('openLoginBtn'),'click',()=>{ window.location.href='login.html'; });
      safeBind($('logoutBtn'),'click',async()=>{ await supabase.auth.signOut(); setCurrentUser(''); window.location.href='login.html'; });
      safeBind($('openProfileBtn'),'click',()=>$('profileModal')&&$('profileModal').classList.add('show'));
      safeBind($('profileEntryBtn'),'click',()=>$('profileModal')&&$('profileModal').classList.add('show'));
      safeBind($('closeProfileBtn'),'click',()=>$('profileModal')&&$('profileModal').classList.remove('show'));

      const getValue=(id)=>(($(id)||{}).value||'').trim(); const summaryEl=$('summary'); const fieldIds=['company','visitStaff','contact','phone','address','basic','needs','solution'];
      safeBind($('generateBtn'),'click',()=>{ const company=getValue('company')||'某企业'; const text=`${company}走访总结
走访时间：${new Date().toLocaleDateString('zh-CN')}`; if(summaryEl) summaryEl.textContent=text+'
（内容已生成）'; });
      safeBind($('copyBtn'),'click',async()=>{ const text=(summaryEl&&summaryEl.textContent||'').trim(); if(!text||text.includes('点击“生成走访总结”')) return alert('请先生成走访总结，再复制。'); try{ await navigator.clipboard.writeText(text); alert('走访总结已复制。'); }catch(_){ alert('复制失败，请手动复制。'); } });
      safeBind($('clearBtn'),'click',()=>{ fieldIds.forEach((id)=>{ const el=$(id); if(el) el.value=''; }); if(summaryEl) summaryEl.textContent='（点击“生成走访总结”后会显示在这里）'; });
      safeBind($('saveVisitBtn'),'click',async()=>{ const {data}=await supabase.auth.getSession(); const email=(data.session&&data.session.user&&data.session.user.email||'').toLowerCase(); if(!email){ alert('请先登录。'); window.location.href='login.html'; return; } const key=`visitRecords_${email}`; const list=JSON.parse(localStorage.getItem(key)||'[]'); const rec={id:`v_${Date.now()}`,company:getValue('company'),visitStaff:getValue('visitStaff'),contact:getValue('contact'),phone:getValue('phone'),address:getValue('address'),basic:getValue('basic'),needs:getValue('needs'),followUp:getValue('solution'),summary:(summaryEl&&summaryEl.textContent)||'',createdAt:Date.now(),updatedAt:Date.now()}; list.unshift(rec); localStorage.setItem(key,JSON.stringify(list)); alert('已保存到走访记录。'); });
      refreshAuthUI();
    });
  </script>
</body>
</html>
