<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>走访记录查询</title>
<style>:root{--bg:#eef4ff;--card:#fff;--line:#d6e3f6;--text:#1e304e;--primary:#1f5fbf}*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1180px;margin:18px auto;padding:0 14px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 8px 22px rgba(20,50,95,.08)}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:14px}.user{display:flex;align-items:center;gap:10px}.avatar{width:40px;height:40px;border-radius:50%;overflow:hidden;background:#dce9ff;display:flex;align-items:center;justify-content:center;font-weight:700}.avatar img{width:100%;height:100%;object-fit:cover}.btn{border:none;border-radius:9px;padding:8px 12px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#1f5fbf,#1a4f9f);text-decoration:none}.btn.ghost{background:#6d82a1}.card{margin-top:12px;padding:14px}.search{width:100%;height:42px;padding:0 12px;border:1px solid var(--line);border-radius:10px}.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}th,td{padding:10px;border-bottom:1px solid #e7eefb;text-align:left;vertical-align:top}.actions button{margin-right:6px}.muted{color:#607392}.modal{position:fixed;inset:0;background:rgba(14,30,55,.35);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{background:#fff;border-radius:12px;border:1px solid var(--line);padding:16px;max-width:760px;max-height:85vh;overflow:auto;width:100%}pre{white-space:pre-wrap;background:#f7faff;padding:10px;border-radius:8px;border:1px solid #dfebff}.foot{margin:18px 0;color:#5a708f;font-size:13px}@media(max-width:760px){.top{flex-direction:column;align-items:flex-start}.table{display:block;overflow:auto;white-space:nowrap}}</style>
</head><body><main class="wrap"><section class="top"><div class="user"><span id="avatar" class="avatar">人</span><div><div id="nickname">-</div><div class="muted">走访记录查询</div></div></div><div><a class="btn ghost" href="index.html">返回首页</a> <button id="logoutBtn" class="btn ghost">退出登录</button></div></section>
<section class="card"><input id="search" class="search" placeholder="搜索企业名称、联系人、企业需求关键词"/><table class="table"><thead><tr><th>企业名称</th><th>联系人</th><th>联系电话</th><th>走访人员</th><th>企业需求摘要</th><th>后续动作</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></section></main>
<div id="detailModal" class="modal"><div class="panel"><h3>走访记录详情</h3><div id="detail"></div><button id="copyBtn" class="btn">复制走访总结</button> <button id="closeBtn" class="btn ghost">关闭</button></div></div>
<script>const USERS='pt_users_v1',CUR='pt_current_user_v1';const users=JSON.parse(localStorage.getItem(USERS)||'{}');const current=localStorage.getItem(CUR)||'';if(!current||!users[current]){localStorage.removeItem(CUR);location.replace('login.html');}const key=`visitRecords_${current}`;const fmt=(t)=>new Date(t||Date.now()).toLocaleString('zh-CN',{hour12:false});function esc(v){return String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}function renderAvatar(){const u=users[current]||{};nickname.textContent=u.nickname||current;if(u.avatarDataUrl){avatar.innerHTML=`<img src="${u.avatarDataUrl}" alt="头像">`}else{avatar.textContent=(u.nickname||current||'人')[0];}}function getList(){return JSON.parse(localStorage.getItem(key)||'[]');}function render(){const kw=search.value.trim().toLowerCase();const rows=getList().filter(r=>!kw||[r.company,r.contact,r.needs].join(' ').toLowerCase().includes(kw));tbody.innerHTML=rows.map(r=>`<tr><td>${esc(r.company||'未填写')}</td><td>${esc(r.contact||'未填写')}</td><td>${esc(r.phone||'未填写')}</td><td>${esc(r.visitStaff||'未填写')}</td><td>${esc(r.needs||'未填写')}</td><td>${esc(r.followUp||'未填写')}</td><td>${fmt(r.createdAt)}</td><td>${fmt(r.updatedAt)}</td><td class="actions"><button class="btn" onclick="view('${r.id}')">查看详情</button><button class="btn ghost" onclick="delRec('${r.id}')">删除记录</button></td></tr>`).join('')||'<tr><td colspan="9" class="muted">暂无走访记录</td></tr>';}let active=null;function view(id){active=getList().find(i=>i.id===id);if(!active)return;detail.innerHTML=`<p><b>企业名称：</b>${esc(active.company||'未填写')}</p><p><b>联系人：</b>${esc(active.contact||'未填写')}</p><p><b>联系电话：</b>${esc(active.phone||'未填写')}</p><p><b>走访人员：</b>${esc(active.visitStaff||'未填写')}</p><p><b>企业需求摘要：</b>${esc(active.needs||'未填写')}</p><p><b>后续动作：</b>${esc(active.followUp||'未填写')}</p><pre>${esc(active.summary||'未生成走访总结')}</pre>`;detailModal.classList.add('show');}function delRec(id){if(!confirm('确定删除该走访记录吗？删除后无法恢复。'))return;const list=getList().filter(i=>i.id!==id);localStorage.setItem(key,JSON.stringify(list));render();}search.addEventListener('input',render);logoutBtn.onclick=()=>{localStorage.removeItem(CUR);location.replace('login.html');};closeBtn.onclick=()=>detailModal.classList.remove('show');detailModal.onclick=(e)=>{if(e.target===detailModal)detailModal.classList.remove('show');};copyBtn.onclick=async()=>{if(!active||!active.summary)return alert('暂无可复制走访总结。');try{await navigator.clipboard.writeText(active.summary);alert('走访总结已复制。');}catch{alert('复制失败，请手动复制。');}};renderAvatar();render();</script></body></html>
