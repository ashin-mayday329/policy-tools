<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>走访记录查询</title>
<style>:root{--primary:#2563EB;--primary-dark:#1D4ED8;--bg:#F5F7FB;--card:#fff;--border:#D9E2F1;--text:#1F2937;--muted:#64748B;--danger:#EF4444;--shadow:0 10px 26px rgba(15,23,42,.08)}*{box-sizing:border-box}body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}.wrap{max-width:1240px;margin:22px auto;padding:0 16px}.top,.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:var(--shadow)}.top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px}.top h1{margin:0;font-size:22px}.top p{margin:6px 0 0;color:var(--muted);font-size:12px}.user{display:flex;align-items:center;gap:8px}.avatar{width:34px;height:34px;border-radius:50%;overflow:hidden;background:#dbeafe;display:flex;align-items:center;justify-content:center}.avatar img{width:100%;height:100%;object-fit:cover}.btn{border:none;border-radius:12px;padding:9px 14px;color:#fff;background:linear-gradient(135deg,var(--primary),var(--primary-dark));cursor:pointer}.btn.ghost{background:#e2e8f0;color:#334155}.search{width:100%;height:44px;padding:0 12px;border:1px solid var(--border);border-radius:12px;margin-bottom:10px}.table{width:100%;border-collapse:separate;border-spacing:0 8px;font-size:14px}th{font-size:12px;color:var(--muted);text-align:left;padding:8px}td{background:#f8fbff;padding:12px;border-top:1px solid #e7eef9;border-bottom:1px solid #e7eef9}.modal{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:center;justify-content:center;padding:16px}.modal.show{display:flex}.panel{background:#fff;border-radius:16px;border:1px solid var(--border);padding:18px;max-width:760px;max-height:85vh;overflow:auto;width:100%}.muted{color:var(--muted)}</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body><main class="wrap"><section class="top"><div><h1>走访记录查询</h1><p>检索、查看与维护企业走访台账</p></div><div><a class="btn ghost" href="index.html">返回首页</a> <button id="migrateBtn" class="btn">迁移本机走访记录到云端</button> <button id="profileBtn" data-action="open-profile" type="button" class="btn">个人资料</button> <button id="logoutBtn" data-action="logout" type="button" class="btn ghost">退出登录</button></div></section>
<section class="card"><input id="search" class="search" placeholder="搜索企业名称、联系人、企业需求关键词"/><table class="table"><thead><tr><th>企业名称</th><th>联系人</th><th>联系电话</th><th>走访人员</th><th>企业需求摘要</th><th>创建时间</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="tbody"></tbody></table></section></main>
<div id="detailModal" class="modal"><div class="panel"><h3>走访记录详情</h3><div id="detail"></div><button id="copyBtn" type="button" class="btn">复制走访总结</button> <button id="closeBtn" type="button" class="btn ghost">关闭</button></div></div>
<script>
document.addEventListener('DOMContentLoaded',async()=>{const SUPABASE_URL='https://gzuihbsvghmryybyphfl.supabase.co',SUPABASE_KEY='sb_publishable_5Tk7IKGl8NNP78whhTDgdA_H7xO6hLl';const initSupabaseClient=()=>{if(window.supabaseClient&&window.supabaseClient.auth)return window.supabaseClient;if(!window.supabase||typeof window.supabase.createClient!=='function')throw new Error('Supabase SDK 加载失败');window.supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);return window.supabaseClient;};const supabase=initSupabaseClient();const $=id=>document.getElementById(id);const safe=(el,e,f)=>el&&el.addEventListener(e,f);const fmt=t=>new Date(t||Date.now()).toLocaleString('zh-CN',{hour12:false});const esc=v=>String(v||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const {data}=await supabase.auth.getSession();const session=data&&data.session;if(!session||!session.user){location.replace('login.html');return;}const uid=session.user.id,email=(session.user.email||'').toLowerCase();localStorage.setItem('pt_current_user_v1',email);
const {data:profile}=await supabase.from('profiles').select('nickname,avatar_url').eq('id',uid).maybeSingle();const titleEl=document.querySelector('.top > div:first-child');if(titleEl){const name=(profile&&profile.nickname)||email;const avatar=(profile&&profile.avatar_url)||'';titleEl.innerHTML=`<span class="user"><span class="avatar">${avatar?`<img src="${esc(avatar)}" alt="头像">`:(esc(name[0]||'人'))}</span><span>${esc(name)} · 走访记录查询</span></span>`;}
let rows=[],active=null;
async function load(){const {data,error}=await supabase.from('visit_records').select('*').eq('user_id',uid).order('updated_at',{ascending:false}).order('created_at',{ascending:false});if(error){alert('加载较慢，请稍后或刷新。');return;}rows=data||[];render();}
function render(){const kw=($('search').value||'').trim().toLowerCase();const list=rows.filter(r=>!kw||[r.company_name,r.contact_name,r.enterprise_needs].join(' ').toLowerCase().includes(kw));$('tbody').innerHTML=list.map(r=>`<tr><td>${esc(r.company_name||'未填写')}</td><td>${esc(r.contact_name||'未填写')}</td><td>${esc(r.contact_phone||'未填写')}</td><td>${esc(r.visit_staff||'未填写')}</td><td>${esc((r.enterprise_needs||'未填写').slice(0,60))}</td><td>${fmt(r.created_at)}</td><td>${fmt(r.updated_at||r.created_at)}</td><td><button type="button" class="btn" data-a="view" data-id="${r.id}">查看详情</button> <button type="button" class="btn ghost" data-a="del" data-id="${r.id}">删除记录</button></td></tr>`).join('')||'<tr><td colspan="8" class="muted">暂无走访记录</td></tr>'}
function oldRecords(){const keys=[`visitRecords_${email}`,'visitRecords','records'];for(const k of keys){try{const v=JSON.parse(localStorage.getItem(k)||'[]');if(Array.isArray(v)&&v.length)return v;}catch(_){}}return[];}
async function migrate(){const old=oldRecords();if(!old.length){alert('未找到可迁移的本机走访记录。');return;}const payload=old.map(r=>({user_id:uid,company_name:r.company||'',visit_staff:r.visitStaff||'',contact_name:r.contact||'',contact_phone:r.phone||'',office_address:r.address||'',basic_info:r.basic||'',enterprise_needs:r.needs||'',park_solution:r.followUp||r.solution||'',summary_text:r.summary||'',form_data:r.rawFormData||r.formData||r||{}}));const {error}=await supabase.from('visit_records').insert(payload);if(error){alert('保存失败，请稍后重试。');return;}alert('已保存到云端。');load();}
async function del(id){if(!confirm('请再次确认：确定删除该记录吗？'))return;if(!confirm('删除后不可恢复，是否继续？'))return;const {error}=await supabase.from('visit_records').delete().eq('id',id).eq('user_id',uid);if(error){alert('保存失败，请稍后重试。');return;}load();}
safe($('search'),'input',render);const withTimeout=(promise,ms,msg)=>Promise.race([promise,new Promise((_,rej)=>setTimeout(()=>rej(new Error(msg)),ms))]);async function handleLogout(btn){console.log('logout clicked');const old=btn&&btn.textContent;if(btn){btn.disabled=true;btn.textContent='退出中...';}try{if(window.supabaseClient&&window.supabaseClient.auth){await withTimeout(window.supabaseClient.auth.signOut(),5000,'退出登录超时');console.log('logout success');}}catch(err){console.error('logout error or timeout:',err);}finally{location.replace('login.html?logged_out=1');if(btn){btn.disabled=false;btn.textContent=old||'退出登录';}}}document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(b.dataset.action==='open-profile'){console.log('open profile clicked');location.href='index.html';}if(b.dataset.action==='logout'){handleLogout(b);}});safe($('migrateBtn'),'click',migrate);safe($('tbody'),'click',e=>{const b=e.target.closest('button[data-a]');if(!b)return;const id=b.dataset.id;const rec=rows.find(x=>String(x.id)===String(id));if(b.dataset.a==='view'&&rec){active=rec;$('detail').innerHTML=`<p><b>企业名称：</b>${esc(rec.company_name||'未填写')}</p><p><b>联系人：</b>${esc(rec.contact_name||'未填写')}</p><p><b>联系电话：</b>${esc(rec.contact_phone||'未填写')}</p><p><b>走访人员：</b>${esc(rec.visit_staff||'未填写')}</p><p><b>企业需求：</b>${esc(rec.enterprise_needs||'未填写')}</p><p><b>完整表单：</b></p><pre>${esc(JSON.stringify(rec.form_data||{},null,2))}</pre><p><b>走访总结：</b></p><pre>${esc(rec.summary_text||'未生成走访总结')}</pre>`;$('detailModal').classList.add('show');}if(b.dataset.a==='del'){del(id);}});safe($('closeBtn'),'click',()=>$('detailModal').classList.remove('show'));safe($('detailModal'),'click',e=>{if(e.target===$('detailModal'))$('detailModal').classList.remove('show')});safe($('copyBtn'),'click',async()=>{const t=active&&active.summary_text;if(!t){alert('暂无可复制内容。');return;}try{await navigator.clipboard.writeText(t);alert('已复制。');}catch(_){alert('复制失败，请手动复制。');}});
load();});
</script></body></html>
