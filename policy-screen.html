<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>企业科技政策申报初筛工具</title>
  <style>
    :root{--bg:#edf3fc;--card:#fff;--text:#1b2f4e;--muted:#5f7190;--primary:#1f5fbf;--primary2:#114b9d;--line:#d8e3f5}
    *{box-sizing:border-box} body{margin:0;font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text)}
    .wrap{max-width:1100px;margin:20px auto;padding:0 14px 30px}
    .hero{background:linear-gradient(135deg,#1552ac,#2672d8);color:#fff;padding:18px 20px;border-radius:14px;box-shadow:0 8px 24px rgba(20,60,120,.16)}
    .hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;opacity:.95;font-size:14px}
    .card{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:0 8px 24px rgba(15,45,90,.06)}
    h2{margin:0 0 12px;font-size:18px;color:#123f80}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}
    label{display:block;margin:0 0 6px;font-weight:600;font-size:14px}input,select,textarea{width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:#fbfdff}
    textarea{min-height:76px;resize:vertical}.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
    button,a.btn{border:none;padding:10px 16px;border-radius:10px;color:#fff;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
    #genBtn{background:linear-gradient(135deg,var(--primary),var(--primary2))}#copyBtn{background:#0d86ad}#wordBtn{background:#2a7a4f}#clearBtn{background:#6b7f9d}
    .result{margin:16px auto 0;border:1px solid #b8cff2;background:#f4f8ff;border-radius:12px;padding:14px;max-width:920px}
    .report-card{background:#fff;border:1px solid #d7e2f2;border-radius:10px;padding:16px;color:#1f2d45}
    .report-title{text-align:center;font-size:20px;font-weight:700;color:#123f80;margin:0 0 12px}
    .report-meta{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;font-size:14px;margin-bottom:12px;color:#23344d}
    .report-section{border-top:1px solid #e5ecf8;padding-top:12px;margin-top:12px}
    .report-section h3{margin:0 0 8px;color:#123f80;font-size:16px}
    .policy-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .policy-item{border:1px solid #dfe8f7;border-radius:10px;padding:10px;background:#fcfdff}
    .policy-item h4{margin:0 0 8px;color:#153f79;font-size:15px}
    .kv{margin:5px 0;font-size:14px;color:#1f2d45}
    .num-list{margin:4px 0 0 18px;padding:0}
    .num-list li{margin:2px 0;color:#2b3a52}
    .report-tip{margin-top:10px;padding:8px;border:1px dashed #c5d6f1;border-radius:8px;background:#f8fbff;font-size:13px;color:#415876}
    .report-empty{color:#5a6d8f;padding:12px;background:#fff;border:1px dashed #ccd9ef;border-radius:8px}
    .tip{margin-top:14px;color:#2f4668;font-size:13px;background:#f7fbff;border:1px dashed #b7ccef;border-radius:10px;padding:10px}
    @media (max-width:760px){.grid,.policy-grid,.report-meta{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>企业科技政策申报初筛工具</h1>
      <p>适用地区：宁波市｜用于园区服务人员初筛辅助判断（非正式认定）</p>
    </section>

    <section class="card">
      <h2>一、企业基础信息</h2>
      <div class="grid">
        <div><label>企业名称</label><input id="company"></div>
        <div><label>注册地址</label><input id="district"></div>
        <div><label>成立日期</label><input id="founded" type="date"></div>
        <div><label>是否独立法人</label><select id="independent"><option>是</option><option>否</option></select></div>
        <div>
          <label>所属行业</label>
          <select id="industry">
            <option value="">请选择行业</option>
            <optgroup label="制造业与工业">
            <option>新一代信息技术</option><option>高端装备制造</option><option>新材料</option><option>新能源与节能环保</option>
            <option>生物医药与医疗器械</option><option>汽车及零部件</option><option>智能家电</option><option>工业互联网</option>
            <option>软件与信息服务</option><option>人工智能</option><option>集成电路</option><option>电子信息制造</option>
            <option>光伏与储能</option><option>机器人与自动化</option><option>化工与新型化工材料</option><option>纺织服装</option>
            <option>文体用品与消费品制造</option><option>金属制品与机械加工</option><option>模具与精密制造</option><option>食品加工</option>
            </optgroup>
            <optgroup label="服务业与其他">
            <option>跨境电商与贸易服务</option><option>现代物流</option><option>科技服务业</option>
            <option>农业科技</option><option>海洋经济相关</option><option>文化创意</option><option>其他</option>
            </optgroup>
          </select>
          <input id="industryCustom" placeholder="如选择“其他”，请填写具体行业（可选）" style="margin-top:8px;">
        </div>
        <div>
          <label>主营产品或服务</label>
          <select id="mainBiz">
            <option value="">请选择主营产品或服务</option>
            <optgroup label="数字与软件">
            <option>工业软件开发与实施服务</option><option>企业数字化解决方案</option><option>SaaS平台服务</option><option>AI算法与模型服务</option>
            <option>嵌入式系统开发</option><option>物联网终端与系统集成</option><option>芯片设计与封测配套</option><option>电子元器件研发制造</option>
            </optgroup>
            <optgroup label="制造与能源">
            <option>光伏电站投资、建设与运维</option><option>储能系统集成</option><option>节能改造与合同能源管理</option><option>机器人本体与系统集成</option>
            <option>智能制造产线改造</option><option>精密零部件加工</option><option>高端装备研发制造</option><option>新材料研发与销售</option>
            </optgroup>
            <optgroup label="医疗、服务与贸易">
            <option>检验检测与认证服务</option><option>技术咨询与技术转移服务</option><option>医疗器械研发生产</option><option>生物技术研发服务</option>
            <option>汽车零部件制造</option><option>跨境电商运营服务</option><option>供应链与仓储物流服务</option><option>品牌设计与数字营销服务</option>
            <option>其他（请在报告中补充说明）</option>
            </optgroup>
          </select>
          <input id="mainBizCustom" placeholder="如选择“其他”，请填写具体主营产品或服务（可选）" style="margin-top:8px;">
        </div>
        <div><label>是否属于禁止、限制、淘汰类行业</label><select id="forbidden"><option>否</option><option>是</option></select></div>
        <div><label>是否被列入经营异常或严重失信</label><select id="dishonest"><option>否</option><option>是</option></select></div>
        <div class="full"><label>近一年是否发生重大安全、重大质量、严重环保违法问题</label><select id="majorRisk"><option>否</option><option>是</option></select></div>
      </div>
    </section>

    <section class="card">
      <h2>二、规模数据</h2>
      <div class="grid">
        <div><label>职工总数</label><input id="staffTotal" type="number" min="0"></div>
        <div><label>上年度销售收入（万元）</label><input id="sales" type="number" min="0"></div>
        <div><label>上年度资产总额（万元）</label><input id="assets" type="number" min="0"></div>
      </div>
    </section>

    <section class="card">
      <h2>三、研发与人员</h2>
      <div class="grid">
        <div><label>科技人员人数</label><input id="techStaff" type="number" min="0"></div>
        <div><label>上年度研发费用（万元）</label><input id="rdCost" type="number" min="0"></div>
        <div><label>上年度成本费用总额（万元）</label><input id="totalCost" type="number" min="0"></div>
        <div><label>是否有研发项目立项</label><select id="rdProject"><option>有</option><option>无</option></select></div>
        <div class="full"><label>是否有研发辅助账或研发费用归集资料</label><select id="rdAccount"><option>有</option><option>无</option></select></div>
      </div>
    </section>

    <section class="card">
      <h2>四、知识产权与成果</h2>
      <div class="grid">
        <div><label>发明专利数量</label><input id="patent1" type="number" min="0"></div>
        <div><label>实用新型数量</label><input id="patent2" type="number" min="0"></div>
        <div><label>软件著作权数量</label><input id="soft" type="number" min="0"></div>
        <div><label>是否有商标、标准、科技成果或专有技术</label><select id="otherIp"><option>有</option><option>无</option></select></div>
        <div class="full"><label>知识产权是否与主营产品或服务相关</label><select id="ipRelated"><option>是</option><option>否</option></select></div>
      </div>
    </section>

    <section class="card">
      <h2>五、高企相关</h2>
      <div class="grid">
        <div><label>高新技术产品或服务收入（万元）</label><input id="highIncome" type="number" min="0"></div>
        <div><label>总收入（万元）</label><input id="totalIncome" type="number" min="0"></div>
        <div><label>主要技术是否属于国家重点支持的高新技术领域</label><select id="highField"><option>是</option><option>否</option></select></div>
        <div><label>是否有科技成果转化材料</label><select id="transfer"><option>有</option><option>无</option></select></div>
        <div><label>是否有研发组织管理制度</label><select id="rdManage"><option>有</option><option>无</option></select></div>
        <div><label>是否有近三年财务报表或审计基础</label><select id="finance3y"><option>有</option><option>无</option></select></div>
      </div>
    </section>

    <section class="card">
      <h2>六、市创相关</h2>
      <div class="grid">
        <div><label>是否成立5年内</label><select id="within5"><option>是</option><option>否</option></select></div>
        <div><label>是否处于种子期或初创期</label><select id="seed"><option>是</option><option>否</option></select></div>
        <div><label>企业负责人是否为创业团队主要成员</label><select id="founderLead"><option>是</option><option>否</option></select></div>
        <div><label>是否拥有核心技术、核心知识产权或创新商业模式</label><select id="coreInnovation"><option>是</option><option>否</option></select></div>
        <div class="full"><label>是否有融资、孵化器、人才团队、科技金融等情况</label><select id="supporting"><option>有</option><option>无</option></select></div>
      </div>
      <div class="actions">
        <button id="genBtn">生成初筛报告</button>
        <button id="copyBtn" type="button">复制纯文本报告</button>
        <button id="wordBtn" type="button">下载Word</button>
        <button id="printBtn" type="button">打印/另存为PDF</button>
        <button id="clearBtn" type="button">清空表单</button>
        <a class="btn" style="background:#6b7f9d" href="index.html">返回走访总结工具</a>
      </div>
      <div style="margin-top:10px">
        <label>经办人（可随时修改，最终以当前填写为准）</label>
        <input id="operator" placeholder="例如：张三 / 李四 / 王五">
      </div>
      <div class="result">
        <h2>初筛报告</h2>
        <div id="report" class="report-empty">（点击“生成初筛报告”后会显示在这里）</div>
      </div>
      <p class="tip">本工具仅作园区服务初筛参考，正式申报以当年官方通知和主管部门审核为准。</p>
    </section>
  </main>
<script>
const $ = (id)=>document.getElementById(id);
const num = (id)=>Number($(id).value||0);
const yes = (id,v='是')=>$(id).value===v;
function ratio(a,b){return b>0?a/b:0}
function pct(x){return (x*100).toFixed(1)+'%'}
const txt = (v)=> (v && String(v).trim()) ? String(v).trim() : '未填写';
const toList = (arr)=> (arr && arr.length ? arr : ['暂无']);
const listText = (arr)=> toList(arr).map((x,i)=>`${i+1}. ${x}`).join('\n');
let lastPlainText = '';

function evaluate(){
 const company=txt($('company').value)||'该企业';
 const district=txt($('district').value);
 const industry = ($('industry').value||'').trim();
 const industryCustom = $('industryCustom').value.trim();
 const mainBiz = ($('mainBiz').value||'').trim();
 const mainBizCustom = $('mainBizCustom').value.trim();
 const industryFinal = industry.includes('其他') && industryCustom ? industryCustom : (industry || '未填写');
 const mainBizFinal = mainBiz.includes('其他') && mainBizCustom ? mainBizCustom : (mainBiz || '未填写');
 const staff=num('staffTotal'), tech=num('techStaff'), sales=num('sales'), assets=num('assets');
 const rd=num('rdCost'), totalCost=num('totalCost');
 const p1=num('patent1'), p2=num('patent2'), soft=num('soft');
 const total2=p2+soft;
 const techRatio=ratio(tech,staff), rdSales=ratio(rd,sales), rdCostRatio=ratio(rd,totalCost);
 const majorBad = yes('majorRisk')||yes('dishonest')||yes('forbidden');
 const foundedDate = $('founded').value?new Date($('founded').value):null;
 const years = foundedDate ? (Date.now()-foundedDate.getTime())/(365.25*24*3600*1000) : 0;

 // 省科小
 let skFits=[], skRisks=[], skAdv=[];
 if(years>=1) skFits.push('注册成立满一年以上'); else skRisks.push('成立年限不足一年或未填写');
 if(yes('independent')) skFits.push('独立法人、产权与经营主体较清晰'); else skRisks.push('独立法人条件不足');
 if(p1+total2>0 || yes('otherIp')) skFits.push('具备知识产权或专有技术基础'); else skRisks.push('知识产权支撑偏弱');
 if(techRatio>=0.1) skFits.push('科技人员占比达到10%以上（'+pct(techRatio)+'）'); else skRisks.push('科技人员占比不足10%（'+pct(techRatio)+'）');
 if(rd>0) skFits.push('有研发投入'); else skRisks.push('研发投入数据缺失或为0');
 if(!majorBad) skFits.push('未见重大失信/安全/质量/环保问题'); else skRisks.push('存在合规风险记录');
 let skRes = skFits.length>=5?'建议申报':(skFits.length>=3?'可培育后申报':'暂不建议');
 skAdv.push('完善研发台账、知识产权与成果材料，形成可核验佐证。');

 // 国科小
 let gkHard = !majorBad && staff<=500 && sales<=20000 && assets<=20000;
 let techScore = techRatio>=0.3?20:techRatio>=0.25?16:techRatio>=0.2?12:techRatio>=0.15?8:techRatio>=0.1?4:0;
 const rdBySales = rdSales>=0.06?50:rdSales>=0.05?40:rdSales>=0.04?30:rdSales>=0.03?20:rdSales>=0.02?10:0;
 const rdByCost = rdCostRatio>=0.3?50:rdCostRatio>=0.25?40:rdCostRatio>=0.2?30:rdCostRatio>=0.15?20:rdCostRatio>=0.1?10:0;
 let rdScore = Math.max(rdBySales, rdByCost);
 let ipScore = p1>=1?30:total2>=4?24:total2===3?18:total2===2?12:total2===1?6:0;
 let totalScore = techScore+rdScore+ipScore;
 let gkRes = !gkHard?'暂不建议':(totalScore>=60 && techScore>0?'建议申报':(totalScore>=55?'可培育后申报':'暂不建议'));

 // 高企
 let hqFits=0, hqHardFail=false, hqRisk=[];
 if(years>=1) hqFits++; else {hqHardFail=true; hqRisk.push('成立年限不足一年');}
 if((p1+total2>0||yes('otherIp'))&&yes('ipRelated')) hqFits++; else hqRisk.push('核心知识产权与主营关联不足');
 if(yes('highField')) hqFits++; else hqRisk.push('技术领域匹配度不足');
 if(techRatio>=0.1) hqFits++; else hqRisk.push('科技人员占比不足10%');
 const rdReq = sales<=5000?0.05:(sales<=20000?0.04:0.03);
 if(rdSales>=rdReq) hqFits++; else hqRisk.push('研发费用占销售收入比例不足');
 if(ratio(num('highIncome'), num('totalIncome'))>=0.6) hqFits++; else hqRisk.push('高新技术收入占比不足60%');
 if(!majorBad) hqFits++; else {hqHardFail=true; hqRisk.push('存在重大合规风险');}
 if(yes('transfer')) hqFits++; if(yes('rdManage')) hqFits++; if(yes('finance3y')) hqFits++;
 const hqRes = hqHardFail?'暂不建议':(hqFits>=8?'建议申报':(hqFits>=6?'建议培育后申报':'暂不建议'));

 // 市创
 let scScore=0; if(yes('within5')) scScore++; if(yes('seed')) scScore++; if(yes('founderLead')) scScore++; if(yes('coreInnovation')) scScore++; if(techRatio>=0.1) scScore++; if(yes('supporting','有')) scScore++;
 const scRes = scScore>=5?'建议关注市创/市级科技型中小企业方向':'需结合当年宁波市及区县通知进一步确认';

 const overall = [skRes,gkRes,hqRes].filter(x=>x==='建议申报').length>=2?'优先申报':([skRes,gkRes,hqRes].includes('可培育后申报')||hqRes==='建议培育后申报'?'培育后申报':'暂不建议');

 const material = [
 '营业执照、法人及企业基本信息材料','近一年财务数据（销售收入、资产总额、成本费用）','研发费用辅助账/归集表、研发项目立项资料',
 '知识产权证书（发明、实用新型、软著等）及与产品关联说明','高新技术产品（服务）收入说明及证明材料','近三年财务报表/审计基础资料（如有）',
 '合规证明或承诺（无重大失信、安全、质量、环保违法）'
 ];

 const operator = $('operator').value.trim() || '未填写';
 const gkFits = [`硬性条件${gkHard?'基本满足':'存在缺口'}`,`科技人员得分${techScore}分`,`研发投入得分${rdScore}分`,`科技成果得分${ipScore}分`,`预估总分${totalScore}分`];
 const gkRisks = [gkHard?'主要关注分值提升':'人员规模/收入/资产或合规条件存在不满足项'];
 const gkAdv = ['提升科技人员占比、加大研发投入归集、补充Ⅰ类或Ⅱ类知识产权。'];
 const hqFitsText = [`当前符合项约${hqFits}项`];
 const hqAdv = ['围绕知识产权与主营关联、研发费率、高新收入占比和制度材料进行系统补齐。'];
 const scFits = [`市创相关指标符合约${scScore}项`];
 const scRisks = ['若核心技术、团队或成长性材料不足，评估结论可能波动。'];
 const scAdv = ['突出“核心技术+应用场景+成长潜力”，同步完善融资、人才和孵化支撑材料。'];

 const reportHtml = `
 <article class="report-card">
   <h3 class="report-title">【宁波企业科技政策申报初筛报告】</h3>
   <div class="report-meta">
     <div>企业名称：${txt(company)}</div><div>注册地址：${district}</div>
     <div>所属行业：${txt(industryFinal)}</div><div>主营产品或服务：${txt(mainBizFinal)}</div>
   </div>
   <section class="report-section"><h3>一、综合建议</h3>
     <p class="kv">根据企业当前填报信息，建议优先关注：${overall}。</p>
     <p class="kv">其中，省科小（${skRes}）、国科小（${gkRes}）、高企（${hqRes}）、市创（${scRes}）。</p>
   </section>
   <section class="report-section"><h3>二至五、分项目初筛</h3>
     <div class="policy-grid">

$('genBtn').addEventListener('click',evaluate);
$('copyBtn').addEventListener('click', async ()=>{
 const text=lastPlainText.trim(); if(!text){alert('请先生成初筛报告。');return;}
 try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text);}else{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');document.body.removeChild(t);}alert('初筛报告已复制。');}catch{alert('复制失败，请手动复制。');}
});
$('wordBtn').addEventListener('click', ()=>{
 const text=lastPlainText.trim(); if(!text){alert('请先生成初筛报告。');return;}
 const company=($('company').value.trim()||'企业').replace(/[\\\\/:*?\"<>|]/g,'_');
 const lines = text.split('\\n').filter(Boolean);
 const body = lines.map((line, idx)=>{
   if(idx===0) return `<h1>${line}</h1>`;
   if(line.startsWith('综合建议：')) return `<h2>${line}</h2>`;
   if(/^([一二三四])、/.test(line)) return `<h3>${line}</h3>`;
   if(line.startsWith('【提示】')) return `<p class=\"tip\">${line}</p>`;
   if(line.startsWith('- ')) return `<li>${line.slice(2)}</li>`;
   return `<p>${line}</p>`;
 }).join('');
 const html = `<!doctype html><html><head><meta charset=\"UTF-8\"><style>
 body{font-family:\"Microsoft YaHei\",\"PingFang SC\",sans-serif;line-height:1.7;color:#1f2d45;padding:28px}
 .park{font-size:14px;text-align:center;color:#2a4b76;margin:0 0 4px}
 h1{font-size:24px;text-align:center;color:#154c9d;margin:0 0 14px}
 h2{font-size:18px;color:#1757ae;border-left:4px solid #2a7a4f;padding-left:8px}
 h3{font-size:16px;color:#184c96;margin:14px 0 8px}
 p{margin:6px 0;font-size:13.5px} li{margin:4px 0;font-size:13.5px}

 document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(a.href);
});
